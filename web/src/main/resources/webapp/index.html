            function removeStoredRoomSessionsForIdentity(identity, keepParticipantId) {
                const storage = multiplayerSessionStorage();
                if (!storage || !identity) {
                    return false;
                }
                const normalizedRoomName = identity.normalizedRoomName;
                const roomSecret = identity.roomSecret;
                const playerName = identity.playerName;
                if (!normalizedRoomName || !roomSecret || !playerName) {
                    return false;
                }
                const keys = [];
                for (let i = 0; i < storage.length; i++) {
                    const key = storage.key(i);
                    if (key && key.startsWith(MULTIPLAYER_ROOM_SESSION_KEY_PREFIX)) {
                        keys.push(key);
                    }
                }
                let removed = false;
                for (const key of keys) {
                    try {
                        const session = JSON.parse(storage.getItem(key) || "null");
                        if (!storedRoomSessionMatchesIdentity(session, normalizedRoomName, roomSecret, playerName)) {
                            continue;
                        }
                        if (keepParticipantId && session.participantId === keepParticipantId) {
                            continue;
                        }
                        storage.removeItem(key);
                        if (storage.getItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY) === key) {
                            storage.removeItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY);
                        }
                        removed = true;
                    } catch (error) {
                    }
                }
                return removed;
            }

            function acceptStoredRoomIdentityEntry(session) {
                if (!session || !session.participantId) {
                    return;
                }
                removeStoredRoomSessionsForIdentity(session, session.participantId);
                clearStoredRoomIdentityLeaveTombstone(session);
            }

            function storedActiveRoomSessionRunId(session) {
                return String((session && session.snapshot
                        && (session.snapshot.roomRunId || session.snapshot.createNonce))
                        || (session && (session.roomRunId || session.createNonce)) || "");
            }

            function activeRoomSessionMatchesConfig(session, config) {
                if (!session
                        || session.protocolVersion !== MULTIPLAYER_ROOM_PROTOCOL_VERSION
                        || session.source !== MULTIPLAYER_ROOM_SOURCE_ROOM_UI
                        || session.participantId !== config.playerId
                        || session.phase !== "active"
                        || !session.snapshot
                        || session.snapshot.roomPhase !== "active") {
                    return false;
                }
                if (session.transportRoomId + ".active" !== config.roomId) {
                    return false;
                }
                if (config.roomName && session.roomName && session.roomName !== config.roomName) {
                    return false;
                }
                const configRoomRunId = String(config.roomRunId || "");
                const sessionRoomRunId = storedActiveRoomSessionRunId(session);
                return !configRoomRunId || !sessionRoomRunId || configRoomRunId === sessionRoomRunId;
            }

            function removeStoredActiveRoomSessionForConfig(config) {
                const storage = multiplayerSessionStorage();
                if (!storage || !config || !config.playerId || !config.roomId) {
                    return false;
                }
                const keys = [];
                for (let i = 0; i < storage.length; i++) {
                    const key = storage.key(i);
                    if (key && key.startsWith(MULTIPLAYER_ROOM_SESSION_KEY_PREFIX)) {
                        keys.push(key);
                    }
                }
                for (const key of keys) {
                    try {
                        const session = JSON.parse(storage.getItem(key) || "null");
                        if (!activeRoomSessionMatchesConfig(session, config)) {
                            continue;
                        }
                        storage.removeItem(key);
                        if (storage.getItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY) === key) {
                            storage.removeItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY);
                        }
                        return true;
                    } catch (error) {
                    }
                }
                return false;
            }

            function activeRunSnapshotForSession(session) {
                const storage = multiplayerSessionStorage();
                if (!storage || !session) {
                    return null;
                }
                try {
                    return JSON.parse(storage.getItem(
                            activeRunSnapshotStorageKey(activeRoomRestoreKeyForSession(session))) || "null");
                } catch (error) {
                    return null;
                }

            function removeActiveRunSnapshotForSession(session) {
                const storage = multiplayerSessionStorage();
                if (!storage || !session) {
                    return false;
                }
                storage.removeItem(activeRunSnapshotStorageKey(activeRoomRestoreKeyForSession(session)));
                return true;
            }

            function activeReturnDeadlineMs(session, savedSnapshot) {
                return Number(session && session.activeReturnDeadlineMs)
                        || Number(savedSnapshot && savedSnapshot.activeReturnDeadlineMs)
                        || 0;

            function activeRunSnapshotAvailableForReturn(session) {
                const savedSnapshot = activeRunSnapshotForSession(session);
                return !!(savedSnapshot && savedSnapshot.snapshot)
                        && !roomReturnDeadlineExpired(activeReturnDeadlineMs(session, savedSnapshot));
            }

            function markStoredActiveRoomSessionReturnDeadline(config, deadlineMs, reason) {
                const storage = multiplayerSessionStorage();
                if (!storage || !config || !config.playerId || !config.roomId) {
                    return false;
                }
                const keys = [];
                for (let i = 0; i < storage.length; i++) {
                    const key = storage.key(i);
                    if (key && key.startsWith(MULTIPLAYER_ROOM_SESSION_KEY_PREFIX)) {
                        keys.push(key);
                    }
                }
                for (const key of keys) {
                    try {
                        const session = JSON.parse(storage.getItem(key) || "null");
                        if (!activeRoomSessionMatchesConfig(session, config)) {
                            continue;
                        }
                        session.activeReturnDeadlineMs = deadlineMs;
                        session.activeReturnDeadlineReason = String(reason || "");
                        saveMultiplayerRoomSession(session);
                        return true;
                    } catch (error) {
                    }
                }
                return false;
            }

            function markActiveRunSnapshotReturnDeadline(restoreKey, deadlineMs, reason) {
                const storage = multiplayerSessionStorage();
                if (!storage || !restoreKey) {
                    return false;
                }
                try {
                    const key = activeRunSnapshotStorageKey(restoreKey);
                    const savedSnapshot = JSON.parse(storage.getItem(key) || "null") || {};
                    savedSnapshot.activeReturnDeadlineMs = deadlineMs;
                    savedSnapshot.activeReturnDeadlineReason = String(reason || "");
                    storage.setItem(key, JSON.stringify(savedSnapshot));
                    return true;
                } catch (error) {
                    return false;
                }
            }

            function storedRoomSessionReconnectCandidate(session, normalizedRoomName, roomSecret, playerName) {
                return storedRoomSessionMatchesIdentity(session, normalizedRoomName, roomSecret, playerName)
                        && (session.phase === "lobby" || session.phase === "reconnect-handshake")
                        && session.intentionalLeave !== true
                        && !!session.participantId
                        && !!session.snapshot
                        && session.snapshot.roomPhase === "lobby"
                        && snapshotContainsParticipant(session.snapshot, session.participantId);

            function storedRoomSessionOwnerOnlyReconnectCandidate(session) {

                        ? snapshot.participants.filter((participant) => !!participant)
                        : [];
                const participant = participantForId(snapshot, session && session.participantId);
                return storedRoomSessionReconnectCandidate(session,
                        session && session.normalizedRoomName,
                        session && session.roomSecret,
                        session && session.playerName)
                        && !!participant
                        && participants.length === 1
                        && session.roomOwnerParticipantId === session.participantId
                        && snapshot.roomOwnerParticipantId === session.participantId;
            }

            function restoreOwnerOnlyRoomReconnectSession(session) {
                const snapshot = session && session.snapshot;
                const participant = participantForId(snapshot, session && session.participantId);
                if (!snapshot || !participant) {
                    return session;
                }
                session.mode = "rejoin";
                session.phase = "lobby";
                session.reconnectRequestId = "";
                session.reconnectDeadlineMs = 0;
                session.reconnectDeadlineReason = "";
                session.roomOwnerParticipantId = session.participantId;
                session.roomEpoch = Number(snapshot.roomEpoch) || Number(session.roomEpoch) || 1;
                snapshot.roomPhase = "lobby";
                snapshot.roomOwnerParticipantId = session.participantId;
                snapshot.roomEpoch = session.roomEpoch;
                snapshot.countdown = null;
                clearReadyAndCountdown(snapshot);
                participant.connected = true;
                participant.owner = true;
                participant.reconnectDeadlineMs = 0;
                participant.reconnectDeadlineReason = "";
                if (snapshot.capacity) {
                    snapshot.capacity.activeConnections = 1;
                }
                acceptStoredRoomIdentityEntry(session);
                return session;
            }

            function loadStoredRoomSessionForReconnect(normalizedRoomName, roomSecret, playerName) {
                const storage = multiplayerSessionStorage();
                if (!storage) {
                    return null;
                }
                const keys = [];
                const lastKey = storage.getItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY);
                if (lastKey) {
                    keys.push(lastKey);
                }
                for (let i = 0; i < storage.length; i++) {
                    const key = storage.key(i);
                    if (key && key.startsWith(MULTIPLAYER_ROOM_SESSION_KEY_PREFIX)
                            && keys.indexOf(key) === -1) {
                        keys.push(key);
                    }
                }
                let bestSession = null;
                let bestSavedAt = -1;
                for (const key of keys) {
                    try {
                        const session = JSON.parse(storage.getItem(key) || "null");
                        if (storedRoomSessionMatchesIdentity(session,
                                normalizedRoomName, roomSecret, playerName)
                                && roomReturnDeadlineExpired(storedRoomSessionReconnectDeadlineMs(session))) {
                            storage.removeItem(key);
                            if (storage.getItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY) === key) {
                                storage.removeItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY);
                            }
                            continue;
                        }
                        if (!storedRoomSessionReconnectCandidate(session, normalizedRoomName, roomSecret, playerName)) {
                            continue;
                        }
                        const savedAt = Number(session.savedAt || session.createdAt) || 0;
                        if (!bestSession || savedAt > bestSavedAt) {
                            bestSession = session;
                            bestSavedAt = savedAt;
                        }
                    } catch (error) {
                    }
                }
                return bestSession;
            }

            function storedRoomSessionActivePlayerReturnCandidate(session,
                    normalizedRoomName, roomSecret, playerName) {
                return storedRoomSessionMatchesIdentity(session, normalizedRoomName, roomSecret, playerName)
                        && session.intentionalLeave !== true
                        && session.phase === "active"
                        && !!session.participantId
                        && !!session.snapshot
                        && session.snapshot.roomPhase === "active"
                        && playerSeatIndexForParticipant(session.snapshot, session.participantId) >= 0;
            }

            function loadStoredRoomSessionForActivePlayerReturn(normalizedRoomName, roomSecret, playerName) {
                const storage = multiplayerSessionStorage();
                if (!storage) {
                    return null;
                }
                const keys = [];
                const lastKey = storage.getItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY);
                if (lastKey) {
                    keys.push(lastKey);
                }
                for (let i = 0; i < storage.length; i++) {
                    const key = storage.key(i);
                    if (key && key.startsWith(MULTIPLAYER_ROOM_SESSION_KEY_PREFIX)
                            && keys.indexOf(key) === -1) {
                        keys.push(key);
                    }
                }
                let bestSession = null;
                let bestSavedAt = -1;
                for (const key of keys) {
                    try {
                        const session = JSON.parse(storage.getItem(key) || "null");
                        if (!storedRoomSessionActivePlayerReturnCandidate(session,
                                normalizedRoomName, roomSecret, playerName)) {
                            continue;
                        }
                        if (!activeRunSnapshotAvailableForReturn(session)) {
                            storage.removeItem(key);
                            removeActiveRunSnapshotForSession(session);
                            if (storage.getItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY) === key) {
                                storage.removeItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY);
                            }
                            continue;
                        }
                        const savedAt = Number(session.savedAt || session.createdAt) || 0;
                        if (!bestSession || savedAt > bestSavedAt) {
                            bestSession = session;
                            bestSavedAt = savedAt;
                        }
                    } catch (error) {
                    }
                }
                return bestSession;
            }

            function removeStoredRoomSessionStorageEntry(storage, key, session) {
                if (!storage || !key) {
                    return false;
                }
                storage.removeItem(key);
                if (storage.getItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY) === key) {
                    storage.removeItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY);
                }
                if (session && session.phase === "active") {
                    removeActiveRunSnapshotForSession(session);
                }
                return true;
            }

            function storedRoomSessionRejoinKind(session) {
                if (!session
                        || session.protocolVersion !== MULTIPLAYER_ROOM_PROTOCOL_VERSION
                        || session.source !== MULTIPLAYER_ROOM_SOURCE_ROOM_UI
                        || !session.normalizedRoomName
                        || !session.roomSecret
                        || !session.playerName
                        || storedRoomIdentityWasIntentionallyLeft(session)) {
                    return "";
                }
                if (roomReturnDeadlineExpired(storedRoomSessionReconnectDeadlineMs(session))) {
                    return "expired";
                }
                if (storedRoomSessionReconnectCandidate(session,
                        session.normalizedRoomName, session.roomSecret, session.playerName)) {
                    return "reconnect";
                }
                if (storedRoomSessionActivePlayerReturnCandidate(session,
                        session.normalizedRoomName, session.roomSecret, session.playerName)) {
                    return activeRunSnapshotAvailableForReturn(session) ? "active-return" : "unavailable-active";
                }
                return "";
            }

            function loadStoredRoomSessionForRejoinCandidate() {
                const storage = multiplayerSessionStorage();
                if (!storage) {
                    return null;
                }
                const keys = [];
                const lastKey = storage.getItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY);
                if (lastKey) {
                    keys.push(lastKey);
                }
                for (let i = 0; i < storage.length; i++) {
                    const key = storage.key(i);
                    if (key && key.startsWith(MULTIPLAYER_ROOM_SESSION_KEY_PREFIX)
                            && keys.indexOf(key) === -1) {
                        keys.push(key);
                    }
                }
                let best = null;
                let bestSavedAt = -1;
                const removeKeys = [];
                for (const key of keys) {
                    try {
                        const session = JSON.parse(storage.getItem(key) || "null");
                        const kind = storedRoomSessionRejoinKind(session);
                        if (kind === "expired" || kind === "unavailable-active") {
                            removeKeys.push({ key, session });
                            continue;
                        }
                        if (kind !== "reconnect" && kind !== "active-return") {
                            continue;
                        }
                        const savedAt = Number(session.savedAt || session.createdAt) || 0;
                        if (!best || savedAt > bestSavedAt) {
                            best = { key, session, kind };
                            bestSavedAt = savedAt;
                        }
                    } catch (error) {
                    }
                }
                for (const entry of removeKeys) {
                    removeStoredRoomSessionStorageEntry(storage, entry.key, entry.session);
                }
                if (!best) {
                    return null;
                }
                for (const key of keys) {
                    if (key !== best.key && key.startsWith(MULTIPLAYER_ROOM_SESSION_KEY_PREFIX)) {
                        try {
                            const session = JSON.parse(storage.getItem(key) || "null");
                            const kind = storedRoomSessionRejoinKind(session);
                            if (kind === "reconnect" || kind === "active-return") {
                                removeStoredRoomSessionStorageEntry(storage, key, session);
                            }
                        } catch (error) {
                        }
                    }
                }
                return best;
            }

            function hasStoredRoomRejoinCandidate() {
                return !!loadStoredRoomSessionForRejoinCandidate();
            }

            function clearStoredRoomRejoinCandidate(session) {
                if (session) {
                    removeStoredRoomSessionsForIdentity(session);
                    removeMultiplayerRoomSession(session);
                    removeActiveRunSnapshotForSession(session);
                    return true;
                }
                const candidate = loadStoredRoomSessionForRejoinCandidate();
                if (!candidate) {
                    return false;
                }
                removeStoredRoomSessionsForIdentity(candidate.session);
                removeMultiplayerRoomSession(candidate.session);
                removeActiveRunSnapshotForSession(candidate.session);
                return true;
            }

            function createBlockedByStoredRoomRejoinCandidate(normalizedRoomName) {
                const candidate = loadStoredRoomSessionForRejoinCandidate();
                return !!candidate
                        && !!candidate.session
                        && candidate.session.normalizedRoomName === normalizedRoomName;
            }

            async function createFreshJoinSessionFromExpiredReconnect(expiredSession) {
                const participantId = "p-" + multiplayerRandomBase64Url(12);
                const reconnectToken = "rt-" + multiplayerRandomBase64Url(24);
                const reconnectTokenProof = await deriveMultiplayerReconnectTokenProof(
                        expiredSession.roomSecret, participantId, reconnectToken);
                const session = {
                    protocolVersion: MULTIPLAYER_ROOM_PROTOCOL_VERSION,
                    source: expiredSession.source || MULTIPLAYER_ROOM_SOURCE_ROOM_UI,
                    mode: "join",
                    roomName: expiredSession.roomName,
                    normalizedRoomName: expiredSession.normalizedRoomName,
                    playerName: expiredSession.playerName,
                    participantId,
                    participantColor: MULTIPLAYER_ROOM_COLORS[
                            Math.floor(Math.random() * MULTIPLAYER_ROOM_COLORS.length)],
                    reconnectToken,
                    reconnectTokenProof,
                    roomSecret: expiredSession.roomSecret,
                    transportRoomId: expiredSession.transportRoomId,
                    maxConnections: MULTIPLAYER_ROOM_MAX_CONNECTIONS,
                    maxPlayerSeats: MULTIPLAYER_ROOM_MAX_PLAYER_SEATS,
                    finiteTurns: MULTIPLAYER_ROOM_FINITE_TURNS.slice(),
                    floorChaseTurns: MULTIPLAYER_ROOM_DEFAULT_FLOOR_CHASE_TURNS,
                    floorChaseInfinite: false,
                        roomEpoch: 0,
                        roomOwnerParticipantId: "",
                        phase: "join-handshake",
                        createNonce: "",
                        createRaceKey: "",
                        roomRunId: "",
                        joinRequestId: "jr-" + multiplayerRandomBase64Url(12),
                    sharedRunSeed: "",
                    sharedRunSeedChecksum: "",
                    createdAt: Date.now()
                };
                await ensureMultiplayerRoomSessionAuthKeys(session);
                saveMultiplayerRoomSession(session);
                return session;
            }

            async function createMultiplayerRoomRejoinSession() {
                const candidate = loadStoredRoomSessionForRejoinCandidate();
                if (!candidate || !candidate.session) {
                    throw new Error("No room is available to rejoin.");
                }
                const session = candidate.session;
                if (candidate.kind === "reconnect") {
                    if (storedRoomSessionOwnerOnlyReconnectCandidate(session)) {
                        restoreOwnerOnlyRoomReconnectSession(session);
                        await ensureMultiplayerRoomSessionAuthKeys(session);
                        saveMultiplayerRoomSession(session);
                        return session;
                    }
                    session.mode = "rejoin";
                    session.phase = "reconnect-handshake";
                    session.reconnectRequestId = "rr-" + multiplayerRandomBase64Url(12);
                    if (!session.reconnectToken) {
                        session.reconnectTokenProof = "";
                    } else if (!session.reconnectTokenProof) {
                        session.reconnectTokenProof = await deriveMultiplayerReconnectTokenProof(
                                session.roomSecret, session.participantId, session.reconnectToken);
                    }
                    await ensureMultiplayerRoomSessionAuthKeys(session);
                    saveMultiplayerRoomSession(session);
                    return session;
                }
                if (candidate.kind === "active-return") {
                    session.mode = "active-return";
                    session.phase = "active";
                    await ensureMultiplayerRoomSessionAuthKeys(session);
                    saveMultiplayerRoomSession(session);
                    return session;
                }
                clearStoredRoomRejoinCandidate(session);
                throw new Error("No room is available to rejoin.");
            }

            async function createMultiplayerRoomSession(mode, input) {
                mode = mode === "join" ? "join" : "create";
                const validation = validateMultiplayerRoomInput(input);
                if (!validation.ok) {
                    const error = new Error("Invalid room entry.");
                    error.fieldErrors = validation.errors;
                    throw error;
                }
                const secret = await deriveMultiplayerRoomSecret(validation.normalizedRoomName, input.password);
                const transportRoomId = await deriveMultiplayerTransportRoomId(
                        validation.normalizedRoomName, secret.text);
                const identity = {
                    normalizedRoomName: validation.normalizedRoomName,
                    roomSecret: secret.text,
                    playerName: validation.playerName
                };
                const intentionallyLeft = storedRoomIdentityWasIntentionallyLeft(identity);
                if (mode === "join" && intentionallyLeft) {
                    removeStoredRoomSessionsForIdentity(identity);
                }
                if (mode === "create" && createBlockedByStoredRoomRejoinCandidate(validation.normalizedRoomName)) {
                    throw new Error("room rejoin available");
                }
                const participantId = "p-" + multiplayerRandomBase64Url(12);
                const reconnectToken = "rt-" + multiplayerRandomBase64Url(24);
                const reconnectTokenProof = await deriveMultiplayerReconnectTokenProof(
                        secret.text, participantId, reconnectToken);
                const createNonce = mode === "create" ? "cn-" + multiplayerRandomBase64Url(12) : "";
                const createKey = createNonce
                        ? await roomCreateRaceKey(validation.normalizedRoomName, participantId, createNonce)
                        : "";
                const sharedRunSeed = mode === "create" ? multiplayerRandomBase64Url(8) : "";
                const seedDigest = sharedRunSeed
                        ? await multiplayerSha256Bytes(["shpd-shared-seed-checksum-v1", sharedRunSeed])
                        : null;
                const session = {
                    protocolVersion: MULTIPLAYER_ROOM_PROTOCOL_VERSION,
                    source: MULTIPLAYER_ROOM_SOURCE_ROOM_UI,
                    mode,
                    roomName: validation.roomName,
                    normalizedRoomName: validation.normalizedRoomName,
                    playerName: validation.playerName,
                    participantId,
                    participantColor: MULTIPLAYER_ROOM_COLORS[
                            Math.floor(Math.random() * MULTIPLAYER_ROOM_COLORS.length)],
                    reconnectToken,
                    reconnectTokenProof,
                    roomSecret: secret.text,
                    transportRoomId,
                    maxConnections: MULTIPLAYER_ROOM_MAX_CONNECTIONS,
                    maxPlayerSeats: MULTIPLAYER_ROOM_MAX_PLAYER_SEATS,
                    finiteTurns: MULTIPLAYER_ROOM_FINITE_TURNS.slice(),
                    floorChaseTurns: MULTIPLAYER_ROOM_DEFAULT_FLOOR_CHASE_TURNS,
                    floorChaseInfinite: false,
                        roomEpoch: 0,
                        roomOwnerParticipantId: "",
                        phase: mode === "create" ? "create-probe" : "join-handshake",
                        createNonce,
                        createRaceKey: createKey,
                        roomRunId: createNonce,
                        joinRequestId: mode === "join" ? "jr-" + multiplayerRandomBase64Url(12) : "",
                    sharedRunSeed,
                    sharedRunSeedChecksum: seedDigest ? multiplayerBytesToBase64Url(seedDigest).slice(0, 6) : "",
                    createdAt: Date.now()
                };
                await ensureMultiplayerRoomSessionAuthKeys(session);
                saveMultiplayerRoomSession(session);
                return session;
            }

            const multiplayerRoomEvents = [];
            let multiplayerRoomRuntime = null;

            function encodeMultiplayerRoomEvent(type, values) {
                return [type].concat(values || [])
                        .map((value) => String(value == null ? "" : value).replace(/\|/g, "/"))
                        .join("|");
            }

            function pushMultiplayerRoomEvent(type, values) {
                multiplayerRoomEvents.push(encodeMultiplayerRoomEvent(type, values));
            }

            function clearMultiplayerRoomEvents() {
                multiplayerRoomEvents.length = 0;
            }

            function participantFromSession(session, owner) {
                return {
                    participantId: session.participantId,
                    playerName: session.playerName,
                    participantColor: session.participantColor,
                    participantSource: session.source,
                    authPublicKey: session.authPublicKey || null,
                    role: "player",
                    connected: true,
                    owner: owner === true
                };
            }

            function participantForId(snapshot, participantId) {
                if (!snapshot || !Array.isArray(snapshot.participants) || !participantId) {
                    return null;
                }
                return snapshot.participants.find((participant) =>
                    participant && participant.participantId === participantId) || null;
            }

            function participantDisplayColor(participant, fallback) {
                if (participant && participant.participantColor) {
                    return participant.participantColor;
                }
                if (participant && participant.color) {
                    return participant.color;
                }
                return fallback || "";
            }

            function firstOpenSeat(snapshot) {
                for (let i = 0; i < snapshot.playerSeats.length; i++) {
                    if (!snapshot.playerSeats[i].participantId) {
                        return i;
                    }
                }
                return -1;
            }

            function playerSeatIndexForParticipant(snapshot, participantId) {
                if (!snapshot || !Array.isArray(snapshot.playerSeats) || !participantId) {
                    return -1;
                }
                for (let i = 0; i < snapshot.playerSeats.length; i++) {
                    if (snapshot.playerSeats[i].participantId === participantId) {
                        return i;
                    }
                }
                return -1;
            }

            function removeWatcherId(snapshot, participantId) {
                snapshot.watcherIds = (snapshot.watcherIds || [])
                        .filter((watcherId) => watcherId !== participantId);
            }

            function addWatcherId(snapshot, participantId) {
                snapshot.watcherIds = snapshot.watcherIds || [];
                if (snapshot.watcherIds.indexOf(participantId) === -1) {
                    snapshot.watcherIds.push(participantId);
                }
            }

            async function deterministicOwnerTransferId(snapshot, previousOwnerId) {
                const participants = (snapshot.participants || [])
                        .filter((participant) => participant && participant.connected !== false)
                        .map((participant) => participant.participantId)
                        .filter((participantId) => !!participantId)
                        .sort();
                if (participants.length === 0) {
                    return "";
                }
                let bestId = participants[0];
                let bestKey = "";
                for (const participantId of participants) {
                    const key = multiplayerBytesToHex(await multiplayerSha256Bytes([
                        "shpd-owner-transfer-v1",
                        snapshot.sharedRunSeed || "",
                        String(snapshot.ownerTransferSequence || 0),
                        previousOwnerId || "",
                        participantId
                    ]));
                    if (!bestKey || key < bestKey) {
                        bestKey = key;
                        bestId = participantId;
                    }
                }
                return bestId;
            }

            function normalizeParticipantColor(snapshot, participant) {
                const used = new Set((snapshot.participants || [])
                        .map((existing) => String(existing.participantColor || "").toLowerCase()));
                if (!used.has(String(participant.participantColor || "").toLowerCase())) {
                    return participant.participantColor;
                }
                for (const color of MULTIPLAYER_ROOM_COLORS) {
                    if (!used.has(color.toLowerCase())) {
                        return color;
                    }
                }
                return participant.participantColor;
            }

            function initialMultiplayerRoomSnapshot(session) {
                const participant = participantFromSession(session, true);
                return {
                    protocolVersion: MULTIPLAYER_ROOM_PROTOCOL_VERSION,
                    roomName: session.roomName,
                    normalizedRoomName: session.normalizedRoomName,
                    roomPhase: "lobby",
                    roomEpoch: 1,
                    roomOwnerParticipantId: session.participantId,
                    ownerTransferSequence: 0,
                    disconnectSequence: 0,
                        creatorParticipantId: session.participantId,
                        createNonce: session.createNonce,
                        createRaceKey: session.createRaceKey,
                        roomRunId: session.roomRunId || session.createNonce,
                        sharedRunSeed: session.sharedRunSeed,
                    sharedRunSeedChecksum: session.sharedRunSeedChecksum,
                    floorChaseTurns: session.floorChaseTurns,
                    floorChaseInfinite: session.floorChaseInfinite,
                    participants: [participant],
                    playerSeats: [
                        { seat: 0, participantId: session.participantId, heroChoice: "WARRIOR", ready: false },
                        { seat: 1, participantId: "", heroChoice: "", ready: false },
                        { seat: 2, participantId: "", heroChoice: "", ready: false },
                        { seat: 3, participantId: "", heroChoice: "", ready: false }
                    ],
                    watcherIds: [],
                    countdown: null,
                    capacity: {
                        activeConnections: 1,
                        maxConnections: MULTIPLAYER_ROOM_MAX_CONNECTIONS,
                        maxPlayerSeats: MULTIPLAYER_ROOM_MAX_PLAYER_SEATS
                    }
                };
            }

            function snapshotContainsParticipant(snapshot, participantId) {
                return !!snapshot && Array.isArray(snapshot.participants)
                        && snapshot.participants.some((participant) =>
                            participant && participant.participantId === participantId);
            }

            function addParticipantToRoomSnapshot(snapshot, participant) {
                if (!snapshot || !participant || !participant.participantId) {
                    return false;
                }
                delete participant.reconnectToken;
                delete participant.reconnectTokenProof;
                if (snapshot.participants.some((existing) => existing.participantId === participant.participantId)) {
                    return true;
                }
                const seat = firstOpenSeat(snapshot);
                if (seat < 0 || snapshot.participants.length >= MULTIPLAYER_ROOM_MAX_CONNECTIONS) {
                    return false;
                }
                participant.participantColor = normalizeParticipantColor(snapshot, participant);
                snapshot.participants.push(participant);
                participant.role = "player";
                snapshot.playerSeats[seat] = {
                    seat,
                    participantId: participant.participantId,
                    heroChoice: "WARRIOR",
                    ready: false
                };
                snapshot.roomEpoch += 1;
                snapshot.capacity.activeConnections = snapshot.participants.length;
                return true;
            }

            function validHeroChoice(heroChoice) {
                return MULTIPLAYER_ROOM_HERO_CHOICES.indexOf(String(heroChoice || "")) >= 0;
            }

            function bumpRoomSnapshotEpoch(session) {
                const snapshot = session.snapshot;
                snapshot.roomEpoch = (Number(snapshot.roomEpoch) || 1) + 1;
                session.roomEpoch = snapshot.roomEpoch;
            }

            function roomEpochNumber(value) {
                return Number(value) || 0;
            }

            function snapshotMatchesRoomSession(session, snapshot) {
                return !!snapshot && snapshot.normalizedRoomName === session.normalizedRoomName
                        && snapshot.protocolVersion === MULTIPLAYER_ROOM_PROTOCOL_VERSION;
            }

            function snapshotCanUpdateRoomSession(session, snapshot, expectedPhase) {
                if (!snapshotMatchesRoomSession(session, snapshot)) {
                    return false;
                }
                if (expectedPhase && snapshot.roomPhase !== expectedPhase) {
                    return false;
                }
                return roomEpochNumber(snapshot.roomEpoch) >= roomEpochNumber(session.roomEpoch);
            }

            function snapshotCanUpdateLobbyFromSender(session, snapshot, senderParticipantId) {
                if (!snapshotCanUpdateRoomSession(session, snapshot, "lobby")) {
                    return false;
                }
                const currentOwnerParticipantId = String(session.roomOwnerParticipantId || "");
                const snapshotOwnerParticipantId = String(snapshot.roomOwnerParticipantId || "");
                const currentTransferSequence = Number(session.snapshot
                        && session.snapshot.ownerTransferSequence) || 0;
                const snapshotTransferSequence = Number(snapshot.ownerTransferSequence) || 0;
                if (senderParticipantId === currentOwnerParticipantId
                        && snapshotOwnerParticipantId === senderParticipantId) {
                    return true;
                }
                return snapshotTransferSequence > currentTransferSequence
                        && (senderParticipantId === currentOwnerParticipantId
                        || senderParticipantId === snapshotOwnerParticipantId);
            }

            function participantIntentMatchesRoomEpoch(session, intent) {
                return roomEpochNumber(intent && intent.roomEpoch) === roomEpochNumber(session.roomEpoch);
            }

            function clearReadyAndCountdown(snapshot) {
                (snapshot.playerSeats || []).forEach((seat) => {
                    seat.ready = false;
                });
                snapshot.countdown = null;
            }

            async function applyParticipantLeave(runtime, participantId, pushLocalEvent) {
                const session = runtime.session;
                const snapshot = session.snapshot;
                if (!snapshot || snapshot.roomPhase !== "lobby" || !participantForId(snapshot, participantId)) {
                    return { ok: false, reason: "stale room state" };
                }
                clearLobbyDisconnectCleanupTimer(runtime, participantId);
                const wasOwner = snapshot.roomOwnerParticipantId === participantId;
                snapshot.participants = (snapshot.participants || [])
                        .filter((participant) => participant.participantId !== participantId);
                (snapshot.playerSeats || []).forEach((seat, index) => {
                    if (seat.participantId === participantId) {
                        snapshot.playerSeats[index] = {
                            seat: index,
                            participantId: "",
                            heroChoice: "",
                            ready: false
                    };
                    }
                });
                removeWatcherId(snapshot, participantId);
                snapshot.countdown = null;
                clearRoomLaunchTimer(runtime);
                snapshot.capacity = snapshot.capacity || {};
                snapshot.capacity.activeConnections = snapshot.participants.length;
                if (wasOwner) {
                    snapshot.ownerTransferSequence = (Number(snapshot.ownerTransferSequence) || 0) + 1;
                    snapshot.roomOwnerParticipantId = await deterministicOwnerTransferId(snapshot, participantId);
                    (snapshot.participants || []).forEach((participant) => {
                        participant.owner = participant.participantId === snapshot.roomOwnerParticipantId;
                    });
                }
                bumpRoomSnapshotEpoch(session);
                saveMultiplayerRoomSession(session);
                if (snapshot.participants.length > 0) {
                    if (pushLocalEvent !== false) {
                        pushRoomLobbyEvent(session);
                    }
                    sendCurrentRoomSnapshot(runtime);
                }
                return { ok: true, reason: "" };
            }

            function clearLobbyDisconnectCleanupTimer(runtime, participantId) {
                if (!runtime || !runtime.disconnectCleanupTimers) {
                    return;
                }
                const timerId = runtime.disconnectCleanupTimers[participantId];
                if (timerId) {
                    window.clearTimeout(timerId);
                    delete runtime.disconnectCleanupTimers[participantId];
                }
            }

            function scheduleLobbyDisconnectCleanup(runtime, participantId, deadlineMs, disconnectSequence) {
                clearLobbyDisconnectCleanupTimer(runtime, participantId);
                runtime.disconnectCleanupTimers = runtime.disconnectCleanupTimers || {};
                const delayMs = Math.max(0, Number(deadlineMs) - Date.now());
                runtime.disconnectCleanupTimers[participantId] = window.setTimeout(() => {
                    delete runtime.disconnectCleanupTimers[participantId];
                    cleanupLobbyDisconnectedParticipant(runtime, participantId, deadlineMs, disconnectSequence);
                }, delayMs);
            }

            function cleanupLobbyDisconnectedParticipant(runtime, participantId, deadlineMs, disconnectSequence) {
                if (multiplayerRoomRuntime !== runtime) {
                    return;
                }
                const session = runtime && runtime.session;
                const snapshot = session && session.snapshot;
                const participant = participantForId(snapshot, participantId);
                if (!snapshot || session.phase !== "lobby" || snapshot.roomPhase !== "lobby"
                        || !participant || participant.connected !== false
                        || Number(participant.reconnectDeadlineMs) !== Number(deadlineMs)
                        || Number(participant.disconnectSequence) !== Number(disconnectSequence)) {
                    return;
                }
                applyParticipantLeave(runtime, participantId);
            }

            function markLobbyParticipantDisconnected(runtime, participantId) {
                const session = runtime && runtime.session;
                const snapshot = session && session.snapshot;
                const participant = participantForId(snapshot, participantId);
                if (!snapshot || session.phase !== "lobby" || snapshot.roomPhase !== "lobby" || !participant
                        || session.roomOwnerParticipantId !== session.participantId
                        || participant.connected === false) {
                    return false;
                }
                const seatIndex = playerSeatIndexForParticipant(snapshot, participantId);
                const wasOwner = snapshot.roomOwnerParticipantId === participantId;
                const deadlineMs = Date.now() + MULTIPLAYER_ROOM_RECONNECT_GRACE_MS;
                snapshot.disconnectSequence = (Number(snapshot.disconnectSequence) || 0) + 1;
                participant.connected = false;
                participant.reconnectDeadlineMs = deadlineMs;
                participant.disconnectSequence = snapshot.disconnectSequence;
                if (seatIndex >= 0) {
                    snapshot.playerSeats[seatIndex].ready = false;
                }
                if (seatIndex >= 0 || wasOwner) {
                    snapshot.countdown = null;
                    clearRoomLaunchTimer(runtime);
                }
                bumpRoomSnapshotEpoch(session);
                saveMultiplayerRoomSession(session);
                pushRoomLobbyEvent(session);
                sendCurrentRoomSnapshot(runtime);
                scheduleLobbyDisconnectCleanup(runtime, participantId, deadlineMs, participant.disconnectSequence);
                return true;
            }

            function markLobbyOwnerDisconnected(runtime, participantId) {
                const session = runtime && runtime.session;
                const snapshot = session && session.snapshot;
                const participant = participantForId(snapshot, participantId);
                if (!snapshot || session.phase !== "lobby" || snapshot.roomPhase !== "lobby" || !participant
                        || participantId !== snapshot.roomOwnerParticipantId
                        || participantId === session.participantId
                        || participant.connected === false) {
                    return false;
                }
                const seatIndex = playerSeatIndexForParticipant(snapshot, participantId);
                const deadlineMs = Date.now() + MULTIPLAYER_ROOM_RECONNECT_GRACE_MS;
                snapshot.disconnectSequence = (Number(snapshot.disconnectSequence) || 0) + 1;
                participant.connected = false;
                participant.reconnectDeadlineMs = deadlineMs;
                participant.disconnectSequence = snapshot.disconnectSequence;
                if (seatIndex >= 0) {
                    snapshot.playerSeats[seatIndex].ready = false;
                }
                snapshot.countdown = null;
                clearRoomLaunchTimer(runtime);
                bumpRoomSnapshotEpoch(session);
                saveMultiplayerRoomSession(session);
                pushRoomLobbyEvent(session);
                scheduleLobbyDisconnectCleanup(runtime, participantId, deadlineMs, participant.disconnectSequence);
                return true;
            }

            function reconnectBlockedReason(snapshot, participantId) {
                const participant = participantForId(snapshot, participantId);
                if (!participant) {
                    return "reconnect expired";
                }
                if (participant.connected !== false) {
                    return "participant already connected";
                }
                if (!participant.reconnectDeadlineMs || Number(participant.reconnectDeadlineMs) < Date.now()) {
                    return "reconnect expired";
                }
                if (!participant.authPublicKey) {
                    return "invalid reconnect token";
                }
                return "";
            }

            function applyParticipantReconnect(runtime, payload, peerId) {
                const session = runtime && runtime.session;
                const snapshot = session && session.snapshot;
                const participantId = String(payload && payload.targetParticipantId || "");
                if (!snapshot || session.phase !== "lobby" || snapshot.roomPhase !== "lobby"
                        || (session.roomOwnerParticipantId !== session.participantId
                        && participantId !== snapshot.roomOwnerParticipantId)) {
                    return { ok: false, reason: "stale room state" };
                }
                if (String(payload && payload.senderParticipantId || "") !== participantId) {
                    return { ok: false, reason: "invalid reconnect token" };
                }
                const reason = reconnectBlockedReason(snapshot, participantId);
                if (reason) {
                    return { ok: false, reason };
                }
                const participant = participantForId(snapshot, participantId);
                participant.connected = true;
                delete participant.reconnectDeadlineMs;
                delete participant.disconnectSequence;
                clearLobbyDisconnectCleanupTimer(runtime, participantId);
                runtime.peerParticipants = runtime.peerParticipants || {};
                if (peerId) {
                    runtime.peerParticipants[peerId] = participantId;
                }
                bumpRoomSnapshotEpoch(session);
                saveMultiplayerRoomSession(session);
                pushRoomLobbyEvent(session);
                if (peerId) {
                    sendCurrentRoomSnapshot(runtime, peerId);
                }
                sendCurrentRoomSnapshot(runtime);
                return { ok: true, reason: "" };
            }

            function occupiedPlayerSeats(snapshot) {
                return (snapshot.playerSeats || []).filter((seat) => !!seat.participantId);
            }

            function playerSeatOrderForSnapshot(snapshot) {
                return (snapshot.playerSeats || [])
                        .map((seat) => seat && seat.participantId || "")
                        .filter((participantId) => !!participantId)
                        .join(",");
            }

            function startBlockedReason(snapshot) {
                const seats = occupiedPlayerSeats(snapshot);
                if (seats.length === 0) {
                    return "Need at least one player.";
                }
                for (const seat of seats) {
                    const participant = participantForId(snapshot, seat.participantId);
                    if (!participant || participant.connected === false) {
                        return "Waiting for players to reconnect.";
                    }
                    if (seat.participantId !== snapshot.roomOwnerParticipantId && seat.ready !== true) {
                        return "Waiting for players to ready.";
                    }
                }
                return "";
            }

            function applyParticipantIntent(runtime, intent) {
                const session = runtime.session;
                const snapshot = session.snapshot;
                if (!snapshot || snapshot.roomPhase !== "lobby" || !intent || !intent.intentId) {
                    return { ok: false, reason: "stale room state" };
                }
                const participantId = String(intent.participantId || "");
                const handledIntentKey = participantId + ":" + String(intent.intentId || "");
                runtime.handledIntentIds = runtime.handledIntentIds || {};
                if (runtime.handledIntentIds[handledIntentKey]) {
                    return runtime.handledIntentIds[handledIntentKey];
                }
                if (!participantIntentMatchesRoomEpoch(session, intent)) {
                    return { ok: false, reason: "stale room state" };
                }

                const participant = participantForId(snapshot, participantId);
                if (!participant) {
                    return { ok: false, reason: "unknown participant" };
                }

                let result = { ok: true, reason: "" };
                const seatIndex = playerSeatIndexForParticipant(snapshot, participantId);
                if (intent.action === "ready-toggle") {
                    if (seatIndex < 0) {
                        result = { ok: false, reason: "watchers cannot ready" };
                    } else {
                        const seat = snapshot.playerSeats[seatIndex];
                        seat.ready = seat.ready !== true;
                        if (!seat.ready) {
                            snapshot.countdown = null;
                        }
                    }
                } else if (intent.action === "hero-choice") {
                    const heroChoice = String(intent.value || "");
                    if (seatIndex < 0) {
                        result = { ok: false, reason: "watchers cannot choose a hero" };
                    } else if (!validHeroChoice(heroChoice)) {
                        result = { ok: false, reason: "invalid hero" };
                    } else {
                        const seat = snapshot.playerSeats[seatIndex];
                        if (seat.heroChoice !== heroChoice) {
                            seat.heroChoice = heroChoice;
                            seat.ready = false;
                            snapshot.countdown = null;
                        }
                    }
                } else {
                    result = { ok: false, reason: "unknown action" };
                }

                if (result.ok) {
                    bumpRoomSnapshotEpoch(session);
                    saveMultiplayerRoomSession(session);
                    pushRoomLobbyEvent(session);
                    sendCurrentRoomSnapshot(runtime);
                    scheduleRoomLaunchIfOwner(runtime);
                }
                runtime.handledIntentIds[handledIntentKey] = result;
                return result;
            }

            function clearRoomLaunchTimer(runtime) {
                if (runtime && runtime.launchTimerId) {
                    window.clearTimeout(runtime.launchTimerId);
                    runtime.launchTimerId = 0;
                }
            }

            function scheduleRoomLaunchIfOwner(runtime) {
                clearRoomLaunchTimer(runtime);
                const session = runtime && runtime.session;
                const snapshot = session && session.snapshot;
                if (!runtime || !session || !snapshot || session.phase !== "lobby"
                        || snapshot.roomPhase !== "lobby"
                        || snapshot.roomOwnerParticipantId !== session.participantId
                        || !snapshot.countdown || !snapshot.countdown.deadlineMs) {
                    return;
                }
                const delayMs = Math.max(0, Number(snapshot.countdown.deadlineMs) - Date.now());
                runtime.launchTimerId = window.setTimeout(() => {
                    runtime.launchTimerId = 0;
                    launchMultiplayerRoom(runtime);
                }, delayMs);
            }

            function launchSpecForParticipant(session, participantId) {
                const snapshot = session.snapshot || {};
                const seatIndex = playerSeatIndexForParticipant(snapshot, participantId);
                if (seatIndex >= 0) {
                    const seat = snapshot.playerSeats[seatIndex];
                    return {
                        role: "player",
                        heroChoice: seat.heroChoice || "WARRIOR",
                        watchTargetId: ""
                    };
                }
                const firstPlayer = occupiedPlayerSeats(snapshot)[0];
                return {
                    role: "watcher",
                    heroChoice: "",
                    watchTargetId: firstPlayer && firstPlayer.participantId || ""
                };
            }

            function activeRoomRunIdForSession(session) {
                const snapshot = session && session.snapshot || {};
                return String(snapshot.roomRunId || session.roomRunId || snapshot.createNonce
                        || session.createNonce || "");
            }

            function roomLaunchEventValues(session) {
                const snapshot = session.snapshot || {};
                const launch = launchSpecForParticipant(session, session.participantId);
                const participant = participantForId(snapshot, session.participantId) || {};
                return [
                    snapshot.roomName || session.roomName,
                    session.participantId,
                    launch.role,
                    launch.heroChoice,
                    snapshot.sharedRunSeed || session.sharedRunSeed || "",
                    snapshot.sharedRunSeedChecksum || session.sharedRunSeedChecksum || "",
                    snapshot.floorChaseTurns || session.floorChaseTurns || MULTIPLAYER_ROOM_DEFAULT_FLOOR_CHASE_TURNS,
                    String(snapshot.floorChaseInfinite === true),
                    snapshot.roomEpoch || session.roomEpoch || 1,
                    launch.watchTargetId,
                    participant.playerName || "",
                    participantDisplayColor(participant, session.participantColor),
                    playerSeatOrderForSnapshot(snapshot)
                ];
            }

            function pushRoomLaunchEvent(session) {
                pushMultiplayerRoomEvent("room-launch", roomLaunchEventValues(session));
            }

            function activeRunSnapshotStorageKey(restoreKey) {
                return restoreKey + ".activeRunSnapshot";
            }

            function activeRoomRestoreKeyForSession(session) {
                return multiplayerRestoreKey(
                        session.transportRoomId + ".active",
                        session.participantId,
                        activeRoomRunIdForSession(session));
            }

            function restoreActiveRoomRunSnapshot(session) {
                const storage = multiplayerSessionStorage();
                if (!storage) {
                    return { ok: false, message: "Saved room state is unavailable in this browser." };
                }
                const restoreKey = activeRoomRestoreKeyForSession(session);
                try {
                    const saved = JSON.parse(storage.getItem(activeRunSnapshotStorageKey(restoreKey)) || "null");
                    if (!saved || !saved.snapshot) {
                        return { ok: false, message: "Saved room state is unavailable." };
                    }
                    if (roomReturnDeadlineExpired(activeReturnDeadlineMs(session, saved))) {
                        removeActiveRunSnapshotForSession(session);
                        return { ok: false, message: "Room reconnect expired. Join again." };
                    }
                    const parsedSourceSlot = Number(saved.sourceSlot);
                    const sourceSlot = Number.isFinite(parsedSourceSlot) ? parsedSourceSlot : MULTIPLAYER_WATCHER_SLOT;
                    const result = restoreBrowserDataSnapshotToSlot(
                            saved.snapshot, sourceSlot, MULTIPLAYER_ACTIVE_RETURN_SLOT, "active player");
                    storage.setItem(restoreKey, "true");
                    storage.setItem(restoreKey + ".message",
                            "Restored room run for player " + session.participantId + ".");
                    storage.setItem(restoreKey + ".resumeSlot", String(MULTIPLAYER_ACTIVE_RETURN_SLOT));
                    return { ok: true, result };
                } catch (error) {
                    return { ok: false, message: browserDataBackupErrorMessage(error) };
                }
            }

            function participantAuthPublicKeysForSnapshot(snapshot) {
                const keys = {};
                (snapshot && snapshot.participants || []).forEach((participant) => {
                    if (participant && participant.participantId && participant.authPublicKey) {
                        keys[participant.participantId] = participant.authPublicKey;
                    }
                });
                return keys;
            }

            function launchedMultiplayerConfigForSession(session) {
                const snapshot = session.snapshot || {};
                const launch = launchSpecForParticipant(session, session.participantId);
                const participant = participantForId(snapshot, session.participantId) || {};
                return {
                    playerId: session.participantId,
                    playerName: participant && participant.playerName || session.playerName || session.participantId,
                    playerColor: participantDisplayColor(participant, session.participantColor),
                    roomId: session.transportRoomId + ".active",
                    roomName: session.roomName,
                    isWatcher: launch.role === "watcher",
                    watchTargetId: launch.watchTargetId,
                    playerSeatOrder: playerSeatOrderForSnapshot(snapshot),
                    roomEpoch: snapshot.roomEpoch || session.roomEpoch || 1,
                    roomRunId: activeRoomRunIdForSession(session),
                    floorChaseTurns: session.snapshot && session.snapshot.floorChaseTurns || MULTIPLAYER_ROOM_DEFAULT_FLOOR_CHASE_TURNS,
                    floorChaseInfinite: !!(session.snapshot && session.snapshot.floorChaseInfinite),
                    participantSource: MULTIPLAYER_ROOM_SOURCE_ROOM_UI,
                    authPrivateKey: session.authPrivateKey || null,
                    participantAuthPublicKeys: participantAuthPublicKeysForSnapshot(snapshot),
                    roomLaunchEventValues: roomLaunchEventValues(session)
                };
            }

            function installLaunchedMultiplayerRuntime(session) {
                installWebMultiplayer(launchedMultiplayerConfigForSession(session));
            }

            function sendRoomLaunch(runtime, peerId) {
                const session = runtime.session;
                sendEncryptedRoomPayload(runtime, {
                    type: "room-launch",
                    snapshot: stripMultiplayerRoomSnapshotSecrets(session.snapshot)
                }, peerId);
            }

            function launchMultiplayerRoom(runtime) {
                const session = runtime.session;
                const snapshot = session.snapshot;
                if (!snapshot || snapshot.roomPhase !== "lobby"
                        || snapshot.roomOwnerParticipantId !== session.participantId) {
                    return { ok: false, reason: "stale room state" };
                }
                const reason = startBlockedReason(snapshot);
                if (reason) {
                    snapshot.countdown = null;
                    bumpRoomSnapshotEpoch(session);
                    saveMultiplayerRoomSession(session);
                    pushMultiplayerRoomEvent("room-status", [reason]);
                    pushRoomLobbyEvent(session);
                    sendCurrentRoomSnapshot(runtime);
                    return { ok: false, reason };
                }
                clearRoomLaunchTimer(runtime);
                snapshot.roomPhase = "active";
                snapshot.countdown = null;
                snapshot.launchedAtMs = Date.now();
                bumpRoomSnapshotEpoch(session);
                session.phase = "active";
                saveMultiplayerRoomSession(session);
                installLaunchedMultiplayerRuntime(session);
                pushRoomLaunchEvent(session);
                sendRoomLaunch(runtime);
                return { ok: true, reason: "" };
            }

            function applyStartToggle(runtime) {
                const session = runtime.session;
                const snapshot = session.snapshot;
                if (!snapshot || snapshot.roomPhase !== "lobby") {
                    return { ok: false, reason: "stale room state" };
                }
                if (snapshot.countdown && snapshot.countdown.deadlineMs) {
                    snapshot.countdown = null;
                    clearRoomLaunchTimer(runtime);
                    bumpRoomSnapshotEpoch(session);
                    saveMultiplayerRoomSession(session);
                    pushRoomLobbyEvent(session);
                    sendCurrentRoomSnapshot(runtime);
                    return { ok: true, reason: "" };
                }
                const reason = startBlockedReason(snapshot);
                if (reason) {
                    pushMultiplayerRoomEvent("room-status", [reason]);
                    return { ok: false, reason };
                }
                const now = Date.now();
                snapshot.countdown = {
                    startedAtMs: now,
                    deadlineMs: now + 5000
                };
                bumpRoomSnapshotEpoch(session);
                saveMultiplayerRoomSession(session);
                pushRoomLobbyEvent(session);
                sendCurrentRoomSnapshot(runtime);
                scheduleRoomLaunchIfOwner(runtime);
                return { ok: true, reason: "" };
            }

            function remoteCreateRaceBeatsSession(session, remoteRaceKey, remoteCreatorParticipantId,
                    activeRoomFallback) {
                remoteRaceKey = String(remoteRaceKey || "");
                if (!remoteRaceKey) {
                    return activeRoomFallback === true;
                }
                const localRaceKey = String(session.createRaceKey || "");
                if (!localRaceKey) {
                    return true;
                }
                if (remoteRaceKey === localRaceKey) {
                    return String(remoteCreatorParticipantId || "") < String(session.participantId || "");
                }
                return remoteRaceKey < localRaceKey;
            }

            async function raceKeyFromCreateProbe(session, payload) {
                if (!payload || !payload.creatorParticipantId || !payload.createNonce) {
                    return "";
                }
                return payload.createRaceKey || await roomCreateRaceKey(session.normalizedRoomName,
                        payload.creatorParticipantId, payload.createNonce);
            }

            async function raceKeyFromSnapshot(session, snapshot) {
                if (!snapshot) {
                    return "";
                }
                if (snapshot.createRaceKey) {
                    return snapshot.createRaceKey;
                }
                if (snapshot.creatorParticipantId && snapshot.createNonce) {
                    return await roomCreateRaceKey(session.normalizedRoomName,
                            snapshot.creatorParticipantId, snapshot.createNonce);
                }
                return "";
            }

            function applyRoomSnapshotToSession(session, snapshot) {
                session.snapshot = snapshot;
                session.phase = snapshot.roomPhase || "lobby";
                    session.roomEpoch = Number(snapshot.roomEpoch) || 1;
                    session.roomOwnerParticipantId = String(snapshot.roomOwnerParticipantId || "");
                    session.roomRunId = session.roomRunId || String(snapshot.roomRunId || snapshot.createNonce || "");
                    session.sharedRunSeed = session.sharedRunSeed || String(snapshot.sharedRunSeed || "");
                session.sharedRunSeedChecksum = session.sharedRunSeedChecksum
                        || String(snapshot.sharedRunSeedChecksum || "");
                saveMultiplayerRoomSession(session);
            }

            function pushRoomLobbyEvent(session) {
                const snapshot = session.snapshot || {};
                const participants = snapshot.participants || [];
                const self = participants.find((participant) => participant.participantId === session.participantId);
                const values = [
                    snapshot.roomName || session.roomName,
                    session.participantId,
                    String(snapshot.roomOwnerParticipantId === session.participantId),
                    snapshot.sharedRunSeedChecksum || session.sharedRunSeedChecksum || "",
                    participants.length || 1,
                    snapshot.capacity && snapshot.capacity.maxConnections
                            ? snapshot.capacity.maxConnections
                            : MULTIPLAYER_ROOM_MAX_CONNECTIONS,
                    snapshot.floorChaseTurns || session.floorChaseTurns || MULTIPLAYER_ROOM_DEFAULT_FLOOR_CHASE_TURNS,
                    String(snapshot.floorChaseInfinite === true),
                    String(!!snapshot.countdown && !!snapshot.countdown.deadlineMs),
                    snapshot.countdown && snapshot.countdown.deadlineMs ? snapshot.countdown.deadlineMs : ""
                ];
                const seats = Array.isArray(snapshot.playerSeats) ? snapshot.playerSeats : [];
                for (let i = 0; i < MULTIPLAYER_ROOM_MAX_PLAYER_SEATS; i++) {
                    const seat = seats[i] || { seat: i, participantId: "", heroChoice: "", ready: false };
                    const participant = participantForId(snapshot, seat.participantId);
                    values.push(
                            seat.participantId || "",
                            (participant && participant.playerName) || "",
                            (participant && participant.participantColor) || "",
                            String(!!participant && participant.owner === true),
                            seat.heroChoice || "",
                            String(seat.ready === true),
                            String(!participant || participant.connected !== false));
                }
                const watchers = (snapshot.watcherIds || [])
                        .map((participantId) => participantForId(snapshot, participantId))
                        .filter((participant) => !!participant);
                values.push(watchers.length);
                watchers.forEach((participant) => {
                    values.push(
                            participant.participantId || "",
                            participant.playerName || "",
                            participant.participantColor || "",
                            String(participant.owner === true),
                            String(participant.connected !== false));
                });
                pushMultiplayerRoomEvent("room-lobby", values);
            }

            function cleanupMultiplayerRoomRuntime(runtime, reason) {
                if (!runtime) {
                    return;
                }
                window.removeEventListener("pagehide", cleanupMultiplayerRoomEntryOnPageHide, true);
                window.removeEventListener("beforeunload", cleanupMultiplayerRoomEntryOnBeforeUnload, true);
                if (roomReturnDeadlineReason(reason)) {
                    markStoredRoomSessionReconnectDeadline(runtime.session,
                            currentRoomReturnDeadlineMs(), reason);
                }
                if (runtime.timerId) {
                    window.clearTimeout(runtime.timerId);
                    runtime.timerId = 0;
                }
                clearRoomHandshakeRetry(runtime);
                Object.keys(runtime.disconnectCleanupTimers || {}).forEach((participantId) => {
                    clearLobbyDisconnectCleanupTimer(runtime, participantId);
                });
                clearRoomLaunchTimer(runtime);
                if (runtime.room && typeof runtime.room.leave === "function") {
                    try {
                        runtime.room.leave();
                    } catch (error) {
                        logWebParity("multiplayer room entry leave failed", {
                            reason,
                            error: browserDataBackupErrorMessage(error)
                        });
                    }
                }
            }

            function cleanupMultiplayerRoomEntry(reason) {
                const runtime = multiplayerRoomRuntime;
                multiplayerRoomRuntime = null;
                cleanupMultiplayerRoomRuntime(runtime, reason);
            }

            function cleanupMultiplayerRoomEntryIfCurrent(runtime, reason) {
                if (multiplayerRoomRuntime !== runtime) {
                    return false;
                }
                multiplayerRoomRuntime = null;
                cleanupMultiplayerRoomRuntime(runtime, reason);
                return true;
            }

            function cleanupMultiplayerRoomEntryOnPageHide() {
                cleanupMultiplayerRoomEntry("pagehide");
            }

            function cleanupMultiplayerRoomEntryOnBeforeUnload() {
                cleanupMultiplayerRoomEntry("beforeunload");
            }

            async function sendEncryptedRoomPayload(runtime, payload, peerId) {
                if (!runtime || !runtime.sendRoomMessage) {
                    return;
                }
                const session = runtime.session;
                const envelope = await encryptMultiplayerRoomPayload(session.roomSecret, session.participantId,
                        Object.assign({}, payload, {
                            roomProtocol: "room-v1",
                            roomName: session.normalizedRoomName,
                            senderParticipantId: session.participantId,
                            roomPhase: session.phase,
                            roomEpoch: session.roomEpoch
                        }));
                await signMultiplayerRoomEnvelope(session, envelope);
                sendWithMultiplayerTransportFault("room", payload && payload.type || "", payload, () => {
                    if (peerId) {
                        runtime.sendRoomMessage(envelope, peerId);
                    } else {
                        runtime.sendRoomMessage(envelope);
                    }
                }, peerId);
            }

            function sendCurrentRoomSnapshot(runtime, peerId) {
                const session = runtime.session;
                if (!session.snapshot) {
                    return;
                }
                sendEncryptedRoomPayload(runtime, {
                    type: "room-snapshot",
                    snapshot: stripMultiplayerRoomSnapshotSecrets(session.snapshot)
                }, peerId);
            }

            function sendCreateProbe(runtime, peerId) {
                const session = runtime.session;
                sendEncryptedRoomPayload(runtime, {
                    type: "room-create-probe",
                    creatorParticipantId: session.participantId,
                    createNonce: session.createNonce,
                    createRaceKey: session.createRaceKey,
                    creatorAuthPublicKey: session.authPublicKey || null
                }, peerId);
            }

            function sendJoinRequest(runtime, peerId) {
                const session = runtime.session;
                sendEncryptedRoomPayload(runtime, {
                    type: "room-join-request",
                    requestId: session.joinRequestId,
                    participant: participantFromSession(session, false)
                }, peerId);
            }

            function sendReconnectRequest(runtime, peerId) {
                const session = runtime.session;
                sendEncryptedRoomPayload(runtime, {
                    type: "room-reconnect-request",
                    requestId: session.reconnectRequestId,
                    targetParticipantId: session.participantId,
                    requesterAuthPublicKey: session.authPublicKey || null
                }, peerId);
            }

            function clearRoomHandshakeRetry(runtime) {
                if (runtime && runtime.handshakeRetryId) {
                    window.clearInterval(runtime.handshakeRetryId);
                    runtime.handshakeRetryId = 0;
                }
            }

            function sendRoomHandshakeRequest(runtime, peerId) {
                const session = runtime && runtime.session;
                if (!runtime || !session) {
                    return;
                }
                if (session.phase === "join-handshake") {
                    sendJoinRequest(runtime, peerId);
                } else if (session.phase === "reconnect-handshake") {
                    sendReconnectRequest(runtime, peerId);
                } else {
                    clearRoomHandshakeRetry(runtime);
                }
            }

            function sendRoomHandshakeRequests(runtime) {
                sendRoomHandshakeRequest(runtime);
                if (!runtime || !runtime.roomPeers || runtime.roomPeers.size === 0) {
                    return;
                }
                for (const peerId of runtime.roomPeers) {
                    sendRoomHandshakeRequest(runtime, peerId);
                }
            }

            function startRoomHandshakeRetry(runtime) {
                clearRoomHandshakeRetry(runtime);
                const session = runtime && runtime.session;
                if (!session || (session.phase !== "join-handshake"
                        && session.phase !== "reconnect-handshake")) {
                    return;
                }
