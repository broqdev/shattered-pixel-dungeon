<!DOCTYPE html>
<html>
    <head>
        <title>%TITLE%</title>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
        <style>
            html {
                width: 100%;
                height: 100%;
            }

            body {
                background: #000;
                width: 100%;
                min-height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            #game-shell {
                box-sizing: border-box;
                display: grid;
                min-height: 100dvh;
                padding: 24px;
                place-items: center;
                width: 100vw;
            }

            #game-container {
                --game-width: 800;
                --game-height: 600;
                aspect-ratio: var(--game-width) / var(--game-height);
                background: #000;
                box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.14),
                    0 18px 48px rgba(0, 0, 0, 0.58);
                max-height: calc(100dvh - 48px);
                max-width: calc(100vw - 48px);
                overflow: hidden;
                position: relative;
                width: min(
                    calc(100vw - 48px),
                    calc((100dvh - 48px) * var(--game-width) / var(--game-height))
                );
            }

            #canvas {
                background: #000;
                border: none;
                display: block;
                height: 100%;
                outline: none;
                touch-action: none;
                width: 100%;
            }

            @media (max-width: 640px), (max-height: 640px) {
                #game-shell {
                    padding: 8px;
                }

                #game-container {
                    max-height: calc(100dvh - 16px);
                    max-width: calc(100vw - 16px);
                    width: min(
                        calc(100vw - 16px),
                        calc((100dvh - 16px) * var(--game-width) / var(--game-height))
                    );
                }
            }
        </style>
    </head>
    <body oncontextmenu="return false">
        <main id="game-shell">
            <div id="game-container">
                <canvas id="canvas" tabindex="0" width="800" height="600"></canvas>
            </div>
        </main>
        <script>
            const DEFAULT_GAME_WIDTH = 800;
            const DEFAULT_GAME_HEIGHT = 600;
            let gameStarted = false;
            let gameTextInputActive = false;
            let gameTextInputMultiline = false;
            let pagehideDispatched = false;

            function formatConsoleValue(value) {
                if (typeof value === "string") {
                    return value;
                }
                try {
                    return JSON.stringify(value);
                } catch (error) {
                    return String(value);
                }
            }

            function benignRtcCloseConsoleError(args) {
                return Array.from(args).some((value) => {
                    const error = value && (value.error || value);
                    const marker = Object.prototype.toString.call(value);
                    const text = [
                        marker,
                        value && value.type,
                        value && value.reason,
                        error && error.name,
                        error && error.message,
                        error && error.reason,
                        error && String(error),
                        formatConsoleValue(value)
                    ].filter((part) => !!part).join(" ");
                    const looksLikeRtcError = marker.includes("RTCErrorEvent")
                            || text.includes("RTCErrorEvent")
                            || text.includes("OperationError");
                    const closeAbort = text.includes("Close called")
                            && (text.includes("User-Initiated Abort") || text.includes("OperationError"));
                    return looksLikeRtcError && closeAbort;
                });
            }

            function installBenignRtcCloseConsoleFilter() {
                if (console.__shpdBenignRtcCloseFilterInstalled) {
                    return;
                }
                const original = console.error || console.log;
                try {
                    console.error = function() {
                        if (benignRtcCloseConsoleError(arguments)) {
                            logWebParity("suppressed benign rtc close error");
                            return;
                        }
                        return original.apply(console, arguments);
                    };
                    console.__shpdBenignRtcCloseFilterInstalled = true;
                } catch (error) {
                    // Some browser contexts expose readonly console methods.
                }
            }

            /* WEB_PARITY_LOGGING_BEGIN */
            const WEB_PARITY_LOGGING_ENABLED = "%WEB_PARITY_LOGGING%" === "true";
            const WEB_PARITY_LOG_KEY = "shpd.webParityLogBuffer";
            const WEB_PARITY_LOG_LIMIT = 300;
            window.__shpdWebParityLogging = WEB_PARITY_LOGGING_ENABLED;

            function webParityStorage() {
                try {
                    return window.sessionStorage;
                } catch (error) {
                    return null;
                }
            }

            function parseWebParityRows(raw) {
                if (!raw) {
                    return [];
                }
                try {
                    const rows = JSON.parse(raw);
                    return Array.isArray(rows) ? rows : [];
                } catch (error) {
                    return [];
                }
            }

            function storeWebParityConsole(level, args) {
                if (!WEB_PARITY_LOGGING_ENABLED) {
                    return;
                }
                const message = Array.from(args).map(formatConsoleValue).join(" ");
                if (!message.includes("[WEB-PARITY]") || message.includes("[WEB-PARITY-HISTORY]")) {
                    return;
                }

                const storage = webParityStorage();
                if (!storage) {
                    return;
                }

                try {
                    const rows = parseWebParityRows(storage.getItem(WEB_PARITY_LOG_KEY));
                    rows.push({ at: new Date().toISOString(), level, message });
                    storage.setItem(WEB_PARITY_LOG_KEY, JSON.stringify(rows.slice(-WEB_PARITY_LOG_LIMIT)));
                } catch (error) {
                    // Diagnostics must never block the game page.
                }
            }

            function replayPreviousWebParityLogs() {
                if (!WEB_PARITY_LOGGING_ENABLED) {
                    return;
                }
                const storage = webParityStorage();
                if (!storage) {
                    return;
                }

                const rows = parseWebParityRows(storage.getItem(WEB_PARITY_LOG_KEY));
                storage.removeItem(WEB_PARITY_LOG_KEY);
                rows.forEach((row) => {
                    console.info("[WEB-PARITY-HISTORY] " + row.at + " " + row.level + " " + row.message);
                });
            }

            function installWebParityConsoleBuffer() {
                if (!WEB_PARITY_LOGGING_ENABLED) {
                    return;
                }
                ["log", "info", "warn", "error"].forEach((level) => {
                    const original = console[level] || console.log;
                    try {
                        console[level] = function() {
                            storeWebParityConsole(level, arguments);
                            if (level === "error" && benignRtcCloseConsoleError(arguments)) {
                                logWebParity("suppressed benign rtc close error");
                                return;
                            }
                            return original.apply(console, arguments);
                    };
                    } catch (error) {
                        // Some browser contexts expose readonly console methods.
                    }
                });
            }

            replayPreviousWebParityLogs();
            installWebParityConsoleBuffer();

            function logWebParity(message, data) {
                if (!WEB_PARITY_LOGGING_ENABLED) {
                    return;
                }
                console.info("[WEB-PARITY] " + message, data || "");
            }
            /* WEB_PARITY_LOGGING_END */
            installBenignRtcCloseConsoleFilter();

            window.__shpdGameTextInputActive = false;
            window.__shpdSetGameTextInputActive = function(active, multiline) {
                const nextActive = active === true;
                const nextMultiline = multiline === true;
                const changed = gameTextInputActive !== nextActive
                        || gameTextInputMultiline !== nextMultiline;
                gameTextInputActive = nextActive;
                gameTextInputMultiline = nextMultiline;
                window.__shpdGameTextInputActive = nextActive;
                if (changed) {
                    logWebParity("game text input active=" + nextActive, {
                        multiline: nextMultiline,
                        activeElement: document.activeElement && document.activeElement.id
                    });
                }
                if (nextActive) {
                    releaseGameTextInputModifiers("activate");
                } else {
                    focusGameCanvas();
                }
            };

            function isGameTextInputActive() {
                return gameTextInputActive === true || window.__shpdGameTextInputActive === true;
            }

            const GAME_TEXT_INPUT_MODIFIER_KEYS = [
                { key: "Meta", code: "MetaLeft", keyCode: 91 },
                { key: "Meta", code: "MetaRight", keyCode: 93 },
                { key: "Control", code: "ControlLeft", keyCode: 17 },
                { key: "Control", code: "ControlRight", keyCode: 17 },
                { key: "Alt", code: "AltLeft", keyCode: 18 },
                { key: "Alt", code: "AltRight", keyCode: 18 },
                { key: "Shift", code: "ShiftLeft", keyCode: 16 },
                { key: "Shift", code: "ShiftRight", keyCode: 16 }
            ];
            let gameTextInputModifierReleaseTimer = 0;
            let gameTextInputMetaMaybeDown = false;

            function releaseGameTextInputModifiers(reason) {
                if (gameTextInputModifierReleaseTimer) {
                    window.clearTimeout(gameTextInputModifierReleaseTimer);
                    gameTextInputModifierReleaseTimer = 0;
                }
                gameTextInputMetaMaybeDown = false;
                for (const modifier of GAME_TEXT_INPUT_MODIFIER_KEYS) {
                    const keyupEvent = new KeyboardEvent("keyup", {
                        key: modifier.key,
                        code: modifier.code,
                        keyCode: modifier.keyCode,
                        which: modifier.keyCode,
                        bubbles: true,
                        cancelable: true
                    });
                    keyupEvent.__shpdModifierRelease = true;
                    document.dispatchEvent(keyupEvent);
                }
                logWebParity("game text input modifier release", { reason });
            }

            function trackGameTextInputModifierState(event) {
                if (event.__shpdModifierRelease === true) {
                    return;
                }
                const isMeta = event.key === "Meta" || event.code === "MetaLeft" || event.code === "MetaRight";
                if (isMeta && event.type === "keydown") {
                    gameTextInputMetaMaybeDown = true;
                    if (gameTextInputModifierReleaseTimer) {
                        window.clearTimeout(gameTextInputModifierReleaseTimer);
                    }
                    gameTextInputModifierReleaseTimer = window.setTimeout(
                            () => releaseGameTextInputModifiers("meta-timeout"), 1200);
                    return;
                }
                if (isMeta && event.type === "keyup" && gameTextInputModifierReleaseTimer) {
                    gameTextInputMetaMaybeDown = false;
                    window.clearTimeout(gameTextInputModifierReleaseTimer);
                    gameTextInputModifierReleaseTimer = 0;
                    return;
                }
                if (event.type === "keydown" && !event.metaKey && gameTextInputMetaMaybeDown) {
                    releaseGameTextInputModifiers("non-meta-key");
                }
            }

            function focusGameCanvas() {
                if (isGameTextInputActive()) {
                    logWebParity("canvas focus skipped text input active", {
                        activeElement: document.activeElement && document.activeElement.id
                    });
                    return;
                }
                const canvas = document.getElementById("canvas");
                if (canvas && document.activeElement !== canvas) {
                    canvas.focus({ preventScroll: true });
                    logWebParity("canvas focused", { activeElement: document.activeElement && document.activeElement.id });
                }
            }

            function focusActiveGameSurface() {
                if (isGameTextInputActive()) {
                    releaseGameTextInputModifiers("surface-focus");
                    return;
                }
                focusGameCanvas();
            }

            function applyDirectStartHowlerPolicy(howler) {
                if (!howler || howler.__shpdDirectStartAudioPolicy) {
                    return howler;
                }

                try {
                    howler.__shpdDirectStartAudioPolicy = true;
                    howler.autoUnlock = true;
                    howler.autoSuspend = false;
                    if (typeof howler.html5PoolSize === "number" && howler.html5PoolSize < 32) {
                        howler.html5PoolSize = 32;
                    }
                    logWebParity("audio direct start webaudio policy", {
                        usingWebAudio: howler.usingWebAudio,
                        autoUnlock: howler.autoUnlock,
                        autoSuspend: howler.autoSuspend,
                        html5PoolSize: howler.html5PoolSize
                    });
                } catch (error) {
                    logWebParity("audio direct start policy failed", {
                        error: error && (error.message || error.name || String(error))
                    });
                }
                return howler;
            }

            function installDirectStartHowlerPolicy() {
                if (window.__shpdHowlerDirectStartPolicyInstalled) {
                    return;
                }

                window.__shpdHowlerDirectStartPolicyInstalled = true;
                let currentHowler = window.Howler;
                try {
                    Object.defineProperty(window, "Howler", {
                        configurable: true,
                        get: function() {
                            return currentHowler;
                        },
                        set: function(value) {
                            currentHowler = applyDirectStartHowlerPolicy(value);
                        }
                    });
                    if (currentHowler) {
                        currentHowler = applyDirectStartHowlerPolicy(currentHowler);
                    }
                } catch (error) {
                    if (window.Howler) {
                        applyDirectStartHowlerPolicy(window.Howler);
                    } else {
                        logWebParity("audio direct start policy install failed", {
                            error: error && (error.message || error.name || String(error))
                        });
                    }
                }
            }

            installDirectStartHowlerPolicy();

            const BROWSER_DATA_BACKUP_FORMAT = "shattered-pixel-dungeon-web-browser-data";
            const BROWSER_DATA_BACKUP_FORMAT_VERSION = 1;
            const BROWSER_DATA_LOCAL_STORAGE_PREFIX = "pref:app:";
            const BROWSER_DATA_WEB_SAVE_MIRROR_PREFS = "web-save-mirror";
            const BROWSER_DATA_WEB_SAVE_MIRROR_INDEX = "__index";
            const BROWSER_DATA_WEB_SAVE_MIRROR_FILE_PREFIX = "file.";
            const BROWSER_DATA_INDEXED_DB_NAME = "db/assets";
            const BROWSER_DATA_INDEXED_DB_STORE = "FILE_DATA";

            function browserDataBackupAvailable() {
                try {
                    return typeof window.indexedDB !== "undefined"
                            && !!window.localStorage
                            && typeof Blob !== "undefined"
                            && typeof URL !== "undefined"
                            && typeof document !== "undefined"
                            && typeof FileReader !== "undefined";
                } catch (error) {
                    return false;
                }
            }

            function browserDataBackupErrorMessage(error) {
                if (!error) {
                    return "Unknown error";
                }
                if (typeof error === "string") {
                    return error;
                }
                return error.message || error.name || String(error);
            }

            function browserDataBackupByteLength(text) {
                if (typeof TextEncoder !== "undefined") {
                    return new TextEncoder().encode(text).length;
                }
                return new Blob([text]).size;
            }

            function collectBrowserDataLocalStorage() {
                const storage = window.localStorage;
                const entries = [];
                for (let i = 0; i < storage.length; i++) {
                    const key = storage.key(i);
                    if (key && key.startsWith(BROWSER_DATA_LOCAL_STORAGE_PREFIX)) {
                        entries.push({ key, value: storage.getItem(key) || "" });
                    }
                }
                entries.sort((left, right) => left.key.localeCompare(right.key));
                return entries;
            }

            function replaceBrowserDataLocalStorage(entries) {
                const storage = window.localStorage;
                const oldKeys = [];
                for (let i = 0; i < storage.length; i++) {
                    const key = storage.key(i);
                    if (key && key.startsWith(BROWSER_DATA_LOCAL_STORAGE_PREFIX)) {
                        oldKeys.push(key);
                    }
                }
                oldKeys.forEach((key) => storage.removeItem(key));
                entries.forEach((entry) => storage.setItem(entry.key, entry.value));
            }

            function bytesToBase64(value) {
                if (!value) {
                    return "";
                }
                const bytes = ArrayBuffer.isView(value)
                        ? new Uint8Array(value.buffer, value.byteOffset, value.byteLength)
                        : new Uint8Array(value);
                let binary = "";
                const chunkSize = 0x8000;
                for (let offset = 0; offset < bytes.length; offset += chunkSize) {
                    const chunk = bytes.subarray(offset, offset + chunkSize);
                    binary += String.fromCharCode.apply(null, chunk);
                }
                return btoa(binary);
            }

            function base64ToInt8Array(value) {
                if (typeof value !== "string") {
                    throw new Error("IndexedDB file contents must be base64 text");
                }
                const binary = atob(value);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new Int8Array(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            }

            function openBrowserDataDatabase() {
                return new Promise((resolve, reject) => {
                    const request = window.indexedDB.open(BROWSER_DATA_INDEXED_DB_NAME, 1);
                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains(BROWSER_DATA_INDEXED_DB_STORE)) {
                            db.createObjectStore(BROWSER_DATA_INDEXED_DB_STORE);
                        }
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error || new Error("Unable to open IndexedDB"));
                    request.onblocked = () => reject(new Error("IndexedDB open was blocked"));
                });
            }

            function serializeBrowserDataRecord(key, value) {
                const type = value && typeof value.type === "number" ? value.type : 2;
                const date = value && value.date instanceof Date ? value.date.toISOString() : null;
                const contents = value && value.contents ? bytesToBase64(value.contents) : "";
                return { key: String(key), type, date, contents };
            }

            async function readBrowserDataIndexedDbRecords() {
                const db = await openBrowserDataDatabase();
                return new Promise((resolve, reject) => {
                    if (!db.objectStoreNames.contains(BROWSER_DATA_INDEXED_DB_STORE)) {
                        db.close();
                        resolve([]);
                        return;
                    }

                    let settled = false;
                    const records = [];
                    const fail = (error) => {
                        if (settled) {
                            return;
                        }
                        settled = true;
                        try {
                            db.close();
                        } catch (ignored) {
                            // Closing is best-effort during error handling.
                        }
                        reject(error);
                    };

                    const transaction = db.transaction(BROWSER_DATA_INDEXED_DB_STORE, "readonly");
                    const store = transaction.objectStore(BROWSER_DATA_INDEXED_DB_STORE);
                    const request = store.openCursor();

                    request.onsuccess = () => {
                        const cursor = request.result;
                        if (cursor) {
                            records.push(serializeBrowserDataRecord(cursor.key, cursor.value));
                            cursor.continue();
                        }
                    };
                    request.onerror = () => fail(request.error || new Error("Unable to read IndexedDB cursor"));
                    transaction.oncomplete = () => {
                        if (settled) {
                            return;
                        }
                        settled = true;
                        db.close();
                        records.sort((left, right) => left.key.localeCompare(right.key));
                        resolve(records);
                    };
                    transaction.onerror = () => fail(transaction.error || new Error("Unable to read IndexedDB"));
                    transaction.onabort = () => fail(transaction.error || new Error("IndexedDB read aborted"));
                });
            }

            async function createBrowserDataBackupPayload(gameVersion) {
                const localStorageEntries = collectBrowserDataLocalStorage();
                const indexedDbRecords = await readBrowserDataIndexedDbRecords();
                return {
                    format: BROWSER_DATA_BACKUP_FORMAT,
                    formatVersion: BROWSER_DATA_BACKUP_FORMAT_VERSION,
                    exportedAt: new Date().toISOString(),
                    gameVersion: gameVersion || "",
                    localStorage: localStorageEntries,
                    indexedDb: indexedDbRecords
                };
            }

            function createBrowserDataSnapshotPayload(gameVersion) {
                const localStorageEntries = collectBrowserDataLocalStorage();
                return {
                    format: BROWSER_DATA_BACKUP_FORMAT,
                    formatVersion: BROWSER_DATA_BACKUP_FORMAT_VERSION,
                    exportedAt: new Date().toISOString(),
                    gameVersion: gameVersion || "",
                    localStorage: localStorageEntries,
                    indexedDb: []
                };
            }

            function createBrowserDataSnapshotPayloadFromFiles(filesJson, gameVersion) {
                const files = JSON.parse(String(filesJson || "{}"));
                const fileNames = Object.keys(files).sort();
                if (fileNames.length === 0) {
                    return null;
                }
                const localStorageEntries = fileNames.map((fileName) => ({
                    key: browserDataWebSaveMirrorFileStorageKey(fileName),
                    value: String(files[fileName] || "")
                }));
                localStorageEntries.push({
                    key: browserDataWebSaveMirrorStorageKey(BROWSER_DATA_WEB_SAVE_MIRROR_INDEX),
                    value: fileNames.join("\n")
                });
                return {
                    format: BROWSER_DATA_BACKUP_FORMAT,
                    formatVersion: BROWSER_DATA_BACKUP_FORMAT_VERSION,
                    exportedAt: new Date().toISOString(),
                    gameVersion: gameVersion || "",
                    localStorage: localStorageEntries,
                    indexedDb: []
                };
            }

            async function replaceBrowserDataIndexedDbRecords(records) {
                const db = await openBrowserDataDatabase();
                return new Promise((resolve, reject) => {
                    let settled = false;
                    const fail = (error) => {
                        if (settled) {
                            return;
                        }
                        settled = true;
                        try {
                            db.close();
                        } catch (ignored) {
                            // Closing is best-effort during error handling.
                        }
                        reject(error);
                    };

                    const transaction = db.transaction(BROWSER_DATA_INDEXED_DB_STORE, "readwrite");
                    const store = transaction.objectStore(BROWSER_DATA_INDEXED_DB_STORE);
                    const clearRequest = store.clear();

                    clearRequest.onsuccess = () => {
                        records.forEach((record) => {
                            const value = { type: record.type, date: record.date };
                            if (record.type === 2) {
                                value.contents = record.contents;
                            }
                            store.put(value, record.key);
                        });
                    };
                    clearRequest.onerror = () => fail(clearRequest.error || new Error("Unable to clear IndexedDB"));
                    transaction.oncomplete = () => {
                        if (settled) {
                            return;
                        }
                        settled = true;
                        db.close();
                        resolve();
                    };
                    transaction.onerror = () => fail(transaction.error || new Error("Unable to write IndexedDB"));
                    transaction.onabort = () => fail(transaction.error || new Error("IndexedDB write aborted"));
                });
            }

            function validateBrowserDataLocalStorage(entries) {
                if (!Array.isArray(entries)) {
                    throw new Error("Browser Data Backup localStorage must be an array");
                }
                const seen = new Set();
                return entries.map((entry) => {
                    if (!entry || typeof entry.key !== "string" || typeof entry.value !== "string") {
                        throw new Error("Browser Data Backup localStorage entries need string keys and values");
                    }
                    if (!entry.key.startsWith(BROWSER_DATA_LOCAL_STORAGE_PREFIX)) {
                        throw new Error("Browser Data Backup contains a non-app localStorage key");
                    }
                    if (seen.has(entry.key)) {
                        throw new Error("Browser Data Backup contains a duplicate localStorage key");
                    }
                    seen.add(entry.key);
                    return { key: entry.key, value: entry.value };
                });
            }

            function validateBrowserDataIndexedDb(records) {
                if (!Array.isArray(records)) {
                    throw new Error("Browser Data Backup indexedDb must be an array");
                }
                const seen = new Set();
                return records.map((record) => {
                    if (!record || typeof record.key !== "string") {
                        throw new Error("Browser Data Backup IndexedDB records need string keys");
                    }
                    if (seen.has(record.key)) {
                        throw new Error("Browser Data Backup contains a duplicate IndexedDB key");
                    }
                    seen.add(record.key);

                    const type = Number(record.type);
                    if (type !== 1 && type !== 2) {
                        throw new Error("Browser Data Backup IndexedDB record has an unknown type");
                    }

                    const date = typeof record.date === "string" && !Number.isNaN(Date.parse(record.date))
                            ? new Date(record.date)
                            : new Date();
                    return {
                        key: record.key,
                        type,
                        date,
                        contents: type === 2 ? base64ToInt8Array(record.contents || "") : null
                    };
                });
            }

            function validateBrowserDataPayload(payload) {
                if (!payload || typeof payload !== "object") {
                    throw new Error("Browser Data Backup must be a JSON object");
                }
                if (payload.format !== BROWSER_DATA_BACKUP_FORMAT) {
                    throw new Error("This is not a Shattered Pixel Dungeon Browser Data Backup");
                }
                if (payload.formatVersion !== BROWSER_DATA_BACKUP_FORMAT_VERSION) {
                    throw new Error("Unsupported Browser Data Backup format version");
                }
                return {
                    localStorage: validateBrowserDataLocalStorage(payload.localStorage),
                    indexedDb: validateBrowserDataIndexedDb(payload.indexedDb)
                };
            }

            function completeBrowserDataBackup(completion, result) {
                try {
                    completion(
                        !!result.success,
                        result.message || "",
                        result.localStorageKeys || 0,
                        result.indexedDbRecords || 0,
                        result.bytes || 0
                    );
                } catch (error) {
                    logWebParity("browser data callback failure", { error: browserDataBackupErrorMessage(error) });
                }
            }

            function downloadBrowserDataBackup(text, exportedAt) {
                const blob = new Blob([text], { type: "application/json;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = "shattered-pixel-dungeon-browser-data-"
                        + exportedAt.replace(/[:.]/g, "-") + ".json";
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                link.remove();
                window.setTimeout(() => URL.revokeObjectURL(url), 0);
                return blob.size;
            }

            async function exportBrowserDataBackup(gameVersion, completion) {
                logWebParity("browser data export begin", { formatVersion: BROWSER_DATA_BACKUP_FORMAT_VERSION });
                try {
                    if (!browserDataBackupAvailable()) {
                        throw new Error("Browser Data Backup is not available in this browser");
                    }
                    const payload = await createBrowserDataBackupPayload(gameVersion);
                    const text = JSON.stringify(payload, null, 2);
                    const bytes = downloadBrowserDataBackup(text, payload.exportedAt);
                    const result = {
                        success: true,
                        message: "Exported Browser Data Backup.",
                        localStorageKeys: payload.localStorage.length,
                        indexedDbRecords: payload.indexedDb.length,
                        bytes
                    };
                    logWebParity("browser data export success", {
                        localStorageKeys: result.localStorageKeys,
                        indexedDbRecords: result.indexedDbRecords,
                        bytes: result.bytes,
                        version: payload.gameVersion,
                        formatVersion: payload.formatVersion
                    });
                    completeBrowserDataBackup(completion, result);
                } catch (error) {
                    const message = browserDataBackupErrorMessage(error);
                    logWebParity("browser data export failure", { error: message });
                    completeBrowserDataBackup(completion, {
                        success: false,
                        message,
                        localStorageKeys: 0,
                        indexedDbRecords: 0,
                        bytes: 0
                    });
                }

                const validated = validateBrowserDataPayload(payload);
                replaceBrowserDataLocalStorage(validated.localStorage);
                return {
                    success: true,

                    localStorageKeys: validated.localStorage.length,
                    indexedDbRecords: 0,
                    bytes: browserDataBackupByteLength(JSON.stringify(payload))
                };
            }

            function browserDataUtf8ToBase64Url(value) {
                const bytes = new TextEncoder().encode(value);
                let binary = "";
                const chunkSize = 0x8000;
                for (let offset = 0; offset < bytes.length; offset += chunkSize) {
                    const chunk = bytes.subarray(offset, offset + chunkSize);
                    binary += String.fromCharCode.apply(null, chunk);
                }
                return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
            }

            function browserDataBase64UrlToUtf8(value) {
                let base64 = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
                while (base64.length % 4 !== 0) {
                    base64 += "=";
                }
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder().decode(bytes);
            }

            function browserDataWebSaveMirrorStorageKey(prefKey) {
                return BROWSER_DATA_LOCAL_STORAGE_PREFIX + BROWSER_DATA_WEB_SAVE_MIRROR_PREFS + ":" + prefKey + "s";
            }

            function browserDataWebSaveMirrorFileStorageKey(fileName) {
                return browserDataWebSaveMirrorStorageKey(
                        BROWSER_DATA_WEB_SAVE_MIRROR_FILE_PREFIX + browserDataUtf8ToBase64Url(fileName));
            }

            function browserDataWebSaveMirrorFileNameFromStorageKey(storageKey) {
                const prefix = BROWSER_DATA_LOCAL_STORAGE_PREFIX
                        + BROWSER_DATA_WEB_SAVE_MIRROR_PREFS + ":" + BROWSER_DATA_WEB_SAVE_MIRROR_FILE_PREFIX;
                if (!storageKey || !storageKey.startsWith(prefix) || !storageKey.endsWith("s")) {
                    return "";
                }
                try {
                    return browserDataBase64UrlToUtf8(storageKey.substring(prefix.length, storageKey.length - 1));
                } catch (error) {
                    return "";
                }
            }

            function browserDataGameFolder(slot) {
                return "game" + (Number(slot) || 0);
            }

            function browserDataFolderContainsFile(folder, fileName) {
                return !!fileName && fileName.startsWith(folder + "/");
            }

            function browserDataCurrentWebSaveMirrorIndex(storage) {
                const raw = storage.getItem(browserDataWebSaveMirrorStorageKey(BROWSER_DATA_WEB_SAVE_MIRROR_INDEX)) || "";
                return new Set(raw.split("\n").filter((fileName) => fileName.length > 0));
            }

            function restoreBrowserDataSnapshotToSlot(payload, sourceSlot, targetSlot, slotLabel) {
                const validated = validateBrowserDataPayload(payload);
                const sourceFolder = browserDataGameFolder(sourceSlot);
                const targetFolder = browserDataGameFolder(targetSlot);
                const remappedEntries = [];
                const remappedFiles = [];

                validated.localStorage.forEach((entry) => {
                    const sourceFileName = browserDataWebSaveMirrorFileNameFromStorageKey(entry.key);
                    if (!browserDataFolderContainsFile(sourceFolder, sourceFileName)) {
                        return;
                    }
                    const targetFileName = targetFolder + sourceFileName.substring(sourceFolder.length);
                    remappedEntries.push({
                        key: browserDataWebSaveMirrorFileStorageKey(targetFileName),
                        value: entry.value
                    });
                    remappedFiles.push(targetFileName);
                });

                if (remappedEntries.length === 0) {
                    throw new Error("Browser Data Snapshot does not contain save files for slot " + sourceSlot);
                }

                const storage = window.localStorage;
                const index = browserDataCurrentWebSaveMirrorIndex(storage);
                Array.from(index).forEach((fileName) => {
                    if (browserDataFolderContainsFile(targetFolder, fileName)) {
                        storage.removeItem(browserDataWebSaveMirrorFileStorageKey(fileName));
                        index.delete(fileName);
                    }
                });
                remappedEntries.forEach((entry, indexInRemap) => {
                    storage.setItem(entry.key, entry.value);
                    index.add(remappedFiles[indexInRemap]);
                });
                storage.setItem(
                        browserDataWebSaveMirrorStorageKey(BROWSER_DATA_WEB_SAVE_MIRROR_INDEX),
                        Array.from(index).sort().join("\n"));

                return {
                    success: true,
                    message: "Restored Browser Data Snapshot to " + (slotLabel || "target") + " slot.",
                    localStorageKeys: remappedEntries.length + 1,
                    indexedDbRecords: 0,
                    bytes: browserDataBackupByteLength(JSON.stringify(payload))
                };
            }

            function restoreBrowserDataSnapshotToWatcherSlot(payload, sourceSlot, targetSlot) {
                return restoreBrowserDataSnapshotToSlot(payload, sourceSlot, targetSlot, "watcher");
            }

            function browserDataDigestHash(value) {
                let hash = 2166136261;
                const text = String(value || "");
                for (let i = 0; i < text.length; i++) {
                    hash ^= text.charCodeAt(i);
                    hash = Math.imul(hash, 16777619) >>> 0;
                }
                return ("00000000" + hash.toString(16)).slice(-8);
            }

            function browserDataSlotDigest(slot) {
                const folder = browserDataGameFolder(slot);
                const files = [];
                collectBrowserDataLocalStorage().forEach((entry) => {
                    const fileName = browserDataWebSaveMirrorFileNameFromStorageKey(entry.key);
                    if (!browserDataFolderContainsFile(folder, fileName)) {
                        return;
                    }
                    files.push({
                        name: fileName.substring(folder.length),
                        bytes: browserDataBackupByteLength(entry.value),
                        hash: browserDataDigestHash(entry.value)
                    });
                });
                files.sort((left, right) => left.name.localeCompare(right.name));
                return {
                    slot: Number(slot) || 0,
                    fileCount: files.length,
                    files,
                    combinedHash: browserDataDigestHash(JSON.stringify(files))
                };
            }

            function pickBrowserDataBackupFile() {
                return new Promise((resolve) => {
                    const input = document.createElement("input");
                    input.type = "file";
                    input.accept = "application/json,.json";
                    input.style.display = "none";
                    let settled = false;

                    const cleanup = () => {
                        input.remove();
                        window.removeEventListener("focus", onFocus, true);
                    };
                    const settle = (file) => {
                        if (settled) {
                            return;
                        }
                        settled = true;
                        cleanup();
                        resolve(file || null);
                    };
                    const onFocus = () => {
                        window.setTimeout(() => {
                            if (!input.files || input.files.length === 0) {
                                settle(null);
                            }
                        }, 250);
                    };

                    input.addEventListener("change", () => settle(input.files && input.files[0]));
                    window.addEventListener("focus", onFocus, true);
                    document.body.appendChild(input);
                    input.click();
                });
            }

            function readBrowserDataBackupFile(file) {
                if (typeof file.text === "function") {
                    return file.text();
                }
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(String(reader.result || ""));
                    reader.onerror = () => reject(reader.error || new Error("Unable to read backup file"));
                    reader.readAsText(file);
                });
            }

            async function importBrowserDataBackup(completion) {
                let phase = "select";
                let localStorageSnapshot = null;
                let indexedDbSnapshot = null;
                let indexedDbReplaced = false;
                try {
                    if (!browserDataBackupAvailable()) {
                        throw new Error("Browser Data Backup is not available in this browser");
                    }

                    const file = await pickBrowserDataBackupFile();
                    if (!file) {
                        logWebParity("browser data import failure", { phase, error: "selection canceled" });
                        completeBrowserDataBackup(completion, {
                            success: false,
                            message: "Browser Data Backup import canceled.",
                            localStorageKeys: 0,
                            indexedDbRecords: 0,
                            bytes: 0
                        });
                        return;
                    }
                    logWebParity("browser data import selected", { name: file.name, bytes: file.size || 0 });

                    phase = "validate";
                    const text = await readBrowserDataBackupFile(file);
                    const payload = validateBrowserDataPayload(JSON.parse(text));
                    const bytes = browserDataBackupByteLength(text);
                    logWebParity("browser data import validated", {
                        localStorageKeys: payload.localStorage.length,
                        indexedDbRecords: payload.indexedDb.length,
                        bytes,
                        formatVersion: BROWSER_DATA_BACKUP_FORMAT_VERSION
                    });

                    phase = "snapshot";
                    localStorageSnapshot = collectBrowserDataLocalStorage();
                    indexedDbSnapshot = await readBrowserDataIndexedDbRecords();

                    phase = "write-local-storage";
                    logWebParity("browser data import confirmed", {
                        localStorageKeys: payload.localStorage.length,
                        indexedDbRecords: payload.indexedDb.length,
                        bytes
                    });
                    replaceBrowserDataLocalStorage(payload.localStorage);

                    phase = "write-indexed-db";
                    await replaceBrowserDataIndexedDbRecords(payload.indexedDb);
                    indexedDbReplaced = true;

                    logWebParity("browser data import write-complete", {
                        localStorageKeys: payload.localStorage.length,
                        indexedDbRecords: payload.indexedDb.length,
                        bytes
                    });
                    completeBrowserDataBackup(completion, {
                        success: true,
                        message: "Imported Browser Data Backup. Reloading...",
                        localStorageKeys: payload.localStorage.length,
                        indexedDbRecords: payload.indexedDb.length,
                        bytes
                    });
                    logWebParity("browser data import reload", {
                        localStorageKeys: payload.localStorage.length,
                        indexedDbRecords: payload.indexedDb.length,
                        bytes
                    });
                    window.setTimeout(() => window.location.reload(), 250);
                } catch (error) {
                    const message = browserDataBackupErrorMessage(error);
                    logWebParity("browser data import failure", { phase, error: message });
                    if (localStorageSnapshot) {
                        try {
                            replaceBrowserDataLocalStorage(localStorageSnapshot);
                        } catch (restoreError) {
                            logWebParity("browser data import localStorage restore failure", {
                                error: browserDataBackupErrorMessage(restoreError)
                            });
                        }
                    }
                    if (indexedDbReplaced && indexedDbSnapshot) {
                        try {
                            await replaceBrowserDataIndexedDbRecords(indexedDbSnapshot);
                        } catch (restoreError) {
                            logWebParity("browser data import IndexedDB restore failure", {
                                error: browserDataBackupErrorMessage(restoreError)
                            });
                        }
                    }
                    completeBrowserDataBackup(completion, {
                        success: false,
                        message,
                        localStorageKeys: 0,
                        indexedDbRecords: 0,
                        bytes: 0
                    });
                }
            }

                const profileName = String(multiplayerParams().get("mpfault") || "").trim();
                const rules = multiplayerTransportFaultRules(profileName);
                multiplayerTransportFaultStateCache = {

            function recordMultiplayerTransportFaultEvent(state, event) {

            function multiplayerTransportFaultRuleMatches(rule, scope, action, payload) {
                if (rule.scope && rule.scope !== scope) {
                    return false;
                }
                if (rule.action && rule.action !== action) {
                    return false;
                }
                if (rule.matchSeq != null && Number(payload && payload.seq) !== Number(rule.matchSeq)) {
                    return false;
                }
                return true;
            }

            function sendWithMultiplayerTransportFault(scope, action, payload, sendNow, peerId) {
                const state = currentMultiplayerTransportFaultState();
                if (!state.active) {
                    sendNow();
                    return;
                }
                const matchingRules = state.rules.filter((rule) =>
                    multiplayerTransportFaultRuleMatches(rule, scope, action, payload));
                state.counters.sent += 1;
                recordMultiplayerTransportFaultEvent(state, {
                    type: "send",
                    scope,
                    action,
                    peerId: peerId || "",
                    rules: matchingRules.map((rule) => rule.name),
                    payload: multiplayerTransportFaultPayloadClone(payload)
                });
                if (matchingRules.length === 0) {
                    sendNow();
                    state.counters.delivered += 1;
                    recordMultiplayerTransportFaultEvent(state, {
                        type: "deliver",
                        scope,
                        action,
                        peerId: peerId || "",
                        copy: 0,
                        passThrough: true
                    });
                    return;
                }
                if (matchingRules.some((rule) => rule.drop === true)) {
                    state.counters.dropped += 1;
                    recordMultiplayerTransportFaultEvent(state, {
                        type: "drop",
                        scope,
                        action,
                        peerId: peerId || ""
                    });
                    return;
                }
                const duplicateCount = matchingRules.reduce((count, rule) =>
                    Math.max(count, Number(rule.duplicateCount) || 0), 0);
                const delayMs = matchingRules.reduce((total, rule) =>
                    total + (Number(rule.delayMs) || 0), 0);
                const duplicateDelayMs = matchingRules.reduce((total, rule) =>
                    total + (Number(rule.duplicateDelayMs) || 0), 0);
                for (let copy = 0; copy <= duplicateCount; copy++) {
                    if (copy > 0) {
                        state.counters.duplicated += 1;
                    }
                    const copyDelayMs = delayMs + copy * duplicateDelayMs;
                    if (copyDelayMs > 0 || matchingRules.some((rule) => rule.reorder === true)) {
                        state.counters.delayed += 1;
                    }
                    const deliver = () => {
                        sendNow();
                        state.counters.delivered += 1;
                        recordMultiplayerTransportFaultEvent(state, {
                            type: "deliver",
                            scope,
                            action,
                            peerId: peerId || "",
                            copy,
                            delayMs: copyDelayMs
                        });
                    };
                    if (copyDelayMs > 0) {
                        window.setTimeout(deliver, copyDelayMs);
                    } else {
                        deliver();
                    }
                }
            }

                return Date.now() + MULTIPLAYER_ROOM_RECONNECT_GRACE_MS;
            }

            function multiplayerUrlWithoutCloneFlag() {
                try {
                    const url = new URL(window.location.href);
                    url.searchParams.delete("clone");
                    return url.toString();
                } catch (error) {
                    return window.location.href;
                }
            }

            function multiplayerUrlWithWatchTarget(targetId) {
                try {
                    const url = new URL(window.location.href);
                    url.searchParams.delete("clone");
                    url.searchParams.set("watch", targetId);
                    return url.toString();
                } catch (error) {
                    return window.location.href;
                }

            function multiplayerSessionStorage() {
                try {

            function multiplayerCrypto() {

            function multiplayerTextEncoder() {
                if (typeof TextEncoder !== "function") {

            function multiplayerBytesToBase64Url(bytes) {
                let binary = "";
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return window.btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
            }

            function multiplayerBytesToHex(bytes) {
                let text = "";
                for (let i = 0; i < bytes.length; i++) {
                    text += bytes[i].toString(16).padStart(2, "0");
                }
                return text;
            }

            function multiplayerBase64UrlToBytes(text) {
                const padded = String(text || "").replace(/-/g, "+").replace(/_/g, "/")
                        + "===".slice((String(text || "").length + 3) % 4);
                const binary = window.atob(padded);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return bytes;
            }

            function multiplayerRandomBase64Url(byteCount) {
                const crypto = multiplayerCrypto();
                if (!crypto || typeof crypto.getRandomValues !== "function") {
                    throw new Error("Secure browser randomness is unavailable.");
                }
                const bytes = new Uint8Array(byteCount);
                crypto.getRandomValues(bytes);
                return multiplayerBytesToBase64Url(bytes);

            async function multiplayerSha256Bytes(parts) {
                const crypto = multiplayerCrypto();
                if (!crypto || !crypto.subtle || typeof crypto.subtle.digest !== "function") {
                    throw new Error("Secure browser crypto is unavailable.");
                }
                const text = Array.isArray(parts) ? parts.join("\u0000") : String(parts || "");
                const digest = await crypto.subtle.digest("SHA-256", multiplayerTextEncoder().encode(text));
                return new Uint8Array(digest);
            }

            function normalizeMultiplayerRoomName(roomName) {
                return String(roomName || "").trim().toLowerCase();
            }

            function validateMultiplayerRoomInput(input) {
                input = input || {};
                const roomName = String(input.roomName || "").trim();
                const normalizedRoomName = normalizeMultiplayerRoomName(roomName);
                const password = String(input.password || "");
                const playerName = String(input.playerName || "").trim();
                const errors = {};
                if (!roomName) {
                    errors.roomName = "Room name is required.";
                } else if (!MULTIPLAYER_ROOM_NAME_PATTERN.test(roomName)) {
                    errors.roomName = "Use letters, numbers, dash, or underline.";
                } else if (roomName.length < MULTIPLAYER_ROOM_NAME_MIN_LENGTH) {
                    errors.roomName = "Room name must be at least 6 characters.";
                } else if (roomName.length > MULTIPLAYER_ROOM_NAME_MAX_LENGTH) {
                    errors.roomName = "Room name is too long.";
                }
                if (!password) {
                    errors.password = "Room password is required.";
                } else if (password.length < MULTIPLAYER_ROOM_PASSWORD_MIN_LENGTH) {
                    errors.password = "Room password must be at least 6 characters.";
                } else if (password.length > MULTIPLAYER_ROOM_PASSWORD_MAX_LENGTH) {
                    errors.password = "Room password is too long.";
                }
                if (!playerName) {
                    errors.playerName = "Player name is required.";
                } else if (playerName.length > MULTIPLAYER_ROOM_PLAYER_NAME_MAX_LENGTH) {
                    errors.playerName = "Player name is too long.";
                }
                return {
                    ok: Object.keys(errors).length === 0,
                    errors,
                    roomName,
                    normalizedRoomName,
                    playerName
                };
            }

            async function deriveMultiplayerRoomSecret(normalizedRoomName, password) {
                const bytes = await multiplayerSha256Bytes([
                    "shpd-room-secret-v1",
                    normalizedRoomName,
                    password
                ]);
                return {
                    bytes,
                    text: multiplayerBytesToBase64Url(bytes)
                };
            }

            async function deriveMultiplayerTransportRoomId(normalizedRoomName, roomSecret) {
                const bytes = await multiplayerSha256Bytes([
                    "shpd-room-transport-v1",
                    normalizedRoomName,
                    roomSecret
                ]);
                return "room-" + multiplayerBytesToBase64Url(bytes).slice(0, 43);
            }

            async function deriveMultiplayerReconnectTokenProof(roomSecret, participantId, reconnectToken) {
                const bytes = await multiplayerSha256Bytes([
                    "shpd-room-reconnect-token-v1",
                    roomSecret,
                    participantId,
                    reconnectToken
                ]);
                return multiplayerBytesToBase64Url(bytes);
            }

            function multiplayerCanonicalJson(value) {
                if (value == null || typeof value !== "object") {
                    return JSON.stringify(value);
                }
                if (Array.isArray(value)) {
                    return "[" + value.map(multiplayerCanonicalJson).join(",") + "]";
                }
                return "{" + Object.keys(value).sort().map((key) =>
                    JSON.stringify(key) + ":" + multiplayerCanonicalJson(value[key])).join(",") + "}";
            }

            async function generateMultiplayerParticipantAuthKeys() {
                const crypto = multiplayerCrypto();
                if (!crypto || !crypto.subtle || typeof crypto.subtle.generateKey !== "function") {
                    throw new Error("Secure browser signing is unavailable.");
                }
                const keyPair = await crypto.subtle.generateKey(
                        { name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
                return {
                    privateKey: await crypto.subtle.exportKey("jwk", keyPair.privateKey),
                    publicKey: await crypto.subtle.exportKey("jwk", keyPair.publicKey)
                };
            }

            async function importMultiplayerParticipantPrivateKey(privateKey) {
                return multiplayerCrypto().subtle.importKey("jwk", privateKey,
                        { name: "ECDSA", namedCurve: "P-256" }, false, ["sign"]);
            }

            async function importMultiplayerParticipantPublicKey(publicKey) {
                return multiplayerCrypto().subtle.importKey("jwk", publicKey,
                        { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
            }

            async function signMultiplayerCanonicalPayload(privateKey, payload) {
                if (!privateKey) {
                    return "";
                }
                const key = await importMultiplayerParticipantPrivateKey(privateKey);
                const signature = await multiplayerCrypto().subtle.sign(
                        { name: "ECDSA", hash: "SHA-256" },
                        key,
                        multiplayerTextEncoder().encode(multiplayerCanonicalJson(payload)));
                return multiplayerBytesToBase64Url(new Uint8Array(signature));
            }

            async function verifyMultiplayerCanonicalPayload(publicKey, payload, signature) {
                if (!publicKey || !signature) {
                    return false;
                }
                try {
                    const key = await importMultiplayerParticipantPublicKey(publicKey);
                    return await multiplayerCrypto().subtle.verify(
                            { name: "ECDSA", hash: "SHA-256" },
                            key,
                            multiplayerBase64UrlToBytes(signature),
                            multiplayerTextEncoder().encode(multiplayerCanonicalJson(payload)));
                } catch (error) {
                    return false;
                }
            }

            async function ensureMultiplayerRoomSessionAuthKeys(session) {
                if (session && session.authPrivateKey && session.authPublicKey) {
                    return session;
                }
                const keys = await generateMultiplayerParticipantAuthKeys();
                session.authPrivateKey = keys.privateKey;
                session.authPublicKey = keys.publicKey;
                return session;
            }

            async function roomCreateRaceKey(normalizedRoomName, creatorParticipantId, createNonce) {
                const bytes = await multiplayerSha256Bytes([
                    "shpd-room-create-race-v1",
                    normalizedRoomName,
                    creatorParticipantId,
                    createNonce
                ]);
                return multiplayerBytesToHex(bytes);
            }

            async function importMultiplayerRoomKey(roomSecret) {
                const secretBytes = typeof roomSecret === "string"
                        ? multiplayerBase64UrlToBytes(roomSecret)
                        : roomSecret;
                const crypto = multiplayerCrypto();
                return crypto.subtle.importKey("raw", secretBytes, { name: "AES-GCM" }, false,
                        ["encrypt", "decrypt"]);
            }

            async function encryptMultiplayerRoomPayload(roomSecret, senderParticipantId, payload) {
                const crypto = multiplayerCrypto();
                const iv = new Uint8Array(12);
                crypto.getRandomValues(iv);
                const key = await importMultiplayerRoomKey(roomSecret);
                const messageId = "m-" + multiplayerRandomBase64Url(12);
                const encoded = multiplayerTextEncoder().encode(JSON.stringify(payload || {}));
                const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
                return {
                    v: MULTIPLAYER_ROOM_PROTOCOL_VERSION,
                    sender: String(senderParticipantId || ""),
                    messageId,
                    iv: multiplayerBytesToBase64Url(iv),
                    ciphertext: multiplayerBytesToBase64Url(new Uint8Array(ciphertext))
                };
            }

            function multiplayerRoomEnvelopeSignaturePayload(envelope) {
                return {
                    v: envelope && envelope.v,
                    sender: envelope && envelope.sender || "",
                    messageId: envelope && envelope.messageId || "",
                    iv: envelope && envelope.iv || "",
                    ciphertext: envelope && envelope.ciphertext || ""

            async function signMultiplayerRoomEnvelope(session, envelope) {
                if (!session || !session.authPrivateKey || !envelope) {
                    return envelope;
                }
                envelope.signature = await signMultiplayerCanonicalPayload(session.authPrivateKey,
                        multiplayerRoomEnvelopeSignaturePayload(envelope));
                return envelope;
            }

            function participantAuthPublicKey(participant) {
                return participant && participant.authPublicKey ? participant.authPublicKey : null;
            }

            function roomSnapshotAuthPublicKey(snapshot, participantId) {
                return participantAuthPublicKey(participantForId(snapshot, participantId));
            }

            function roomPayloadInlineAuthPublicKey(payload, senderParticipantId) {
                if (payload && payload.type === "room-join-request"
                        && payload.participant
                        && payload.participant.participantId === senderParticipantId) {
                    return participantAuthPublicKey(payload.participant);
                }
                if (payload && payload.type === "room-create-probe"
                        && payload.creatorParticipantId === senderParticipantId) {
                    return payload.creatorAuthPublicKey || null;
                }
                if (payload && payload.type === "room-reconnect-request"
                        && payload.targetParticipantId === senderParticipantId) {
                    return payload.requesterAuthPublicKey || null;
                }
                return null;
            }

            function roomPayloadAuthPublicKey(session, payload, senderParticipantId) {
                return roomSnapshotAuthPublicKey(session && session.snapshot, senderParticipantId)
                        || roomSnapshotAuthPublicKey(payload && payload.snapshot, senderParticipantId)
                        || roomPayloadInlineAuthPublicKey(payload, senderParticipantId);
            }

            async function verifyMultiplayerRoomEnvelope(session, envelope, payload) {
                const senderParticipantId = String(payload && payload.senderParticipantId || "");
                if (!senderParticipantId || senderParticipantId !== String(envelope && envelope.sender || "")) {
                    return false;
                }
                const publicKey = roomPayloadAuthPublicKey(session, payload, senderParticipantId);
                if (!publicKey) {
                    return false;
                }
                return verifyMultiplayerCanonicalPayload(publicKey,
                        multiplayerRoomEnvelopeSignaturePayload(envelope),
                        envelope && envelope.signature);
            }

            async function decryptMultiplayerRoomEnvelope(roomSecret, envelope) {
                try {
                    if (!envelope || envelope.v !== MULTIPLAYER_ROOM_PROTOCOL_VERSION
                            || !envelope.iv || !envelope.ciphertext) {
                        return null;
                    }
                    const key = await importMultiplayerRoomKey(roomSecret);
                    const plaintext = await multiplayerCrypto().subtle.decrypt(
                            { name: "AES-GCM", iv: multiplayerBase64UrlToBytes(envelope.iv) },
                            key,
                            multiplayerBase64UrlToBytes(envelope.ciphertext));
                    return JSON.parse(new TextDecoder().decode(plaintext));
                } catch (error) {
                    return null;
                }
            }

            function multiplayerRoomSessionKey(session) {
                return MULTIPLAYER_ROOM_SESSION_KEY_PREFIX + session.normalizedRoomName
                        + "." + session.participantId;
            }

            function multiplayerRoomIdentityKey(prefix, identity) {
                return prefix
                        + encodeURIComponent(String(identity && identity.normalizedRoomName || ""))
                        + "." + encodeURIComponent(String(identity && identity.roomSecret || ""))
                        + "." + encodeURIComponent(String(identity && identity.playerName || ""));
            }

            function markStoredRoomIdentityIntentionallyLeft(identity) {
                const storage = multiplayerSessionStorage();
                if (!storage || !identity || !identity.normalizedRoomName
                        || !identity.roomSecret || !identity.playerName) {
                    return false;
                }
                storage.setItem(multiplayerRoomIdentityKey(
                        MULTIPLAYER_ROOM_LEAVE_TOMBSTONE_KEY_PREFIX, identity),
                        JSON.stringify({ leftAt: Date.now() }));
                return true;
            }

            function clearStoredRoomIdentityLeaveTombstone(identity) {
                const storage = multiplayerSessionStorage();
                if (!storage || !identity || !identity.normalizedRoomName
                        || !identity.roomSecret || !identity.playerName) {
                    return false;
                }
                storage.removeItem(multiplayerRoomIdentityKey(
                        MULTIPLAYER_ROOM_LEAVE_TOMBSTONE_KEY_PREFIX, identity));
                return true;
            }

            function storedRoomIdentityWasIntentionallyLeft(identity) {
                const storage = multiplayerSessionStorage();
                if (!storage || !identity || !identity.normalizedRoomName
                        || !identity.roomSecret || !identity.playerName) {
                    return false;
                }
                const key = multiplayerRoomIdentityKey(MULTIPLAYER_ROOM_LEAVE_TOMBSTONE_KEY_PREFIX, identity);
                try {
                    const tombstone = JSON.parse(storage.getItem(key) || "null");
                    const leftAt = Number(tombstone && tombstone.leftAt) || 0;
                    if (!leftAt) {
                        storage.removeItem(key);
                        return false;
                    }
                    return true;
                } catch (error) {
                    storage.removeItem(key);
                    return false;
                }

            function stripMultiplayerRoomSnapshotSecrets(snapshot) {
                if (!snapshot || !Array.isArray(snapshot.participants)) {
                    return snapshot;

                snapshot.participants.forEach((participant) => {
                    if (participant) {
                        delete participant.reconnectToken;
                        delete participant.reconnectTokenProof;
                    }
                });
                return snapshot;
            }

            function saveMultiplayerRoomSession(session) {
                if (session && session.intentionalLeave === true) {
                    return;
                }
                const storage = multiplayerSessionStorage();
                if (!storage) {
                    return;
                }
                stripMultiplayerRoomSnapshotSecrets(session && session.snapshot);
                const key = multiplayerRoomSessionKey(session);
                session.savedAt = Date.now();
                storage.setItem(key, JSON.stringify(session));
                storage.setItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY, key);
            }

            function removeMultiplayerRoomSession(session) {
                const storage = multiplayerSessionStorage();
                if (!storage || !session) {
                    return;
                }
                const key = multiplayerRoomSessionKey(session);
                storage.removeItem(key);
                if (storage.getItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY) === key) {
                    storage.removeItem(MULTIPLAYER_ROOM_LAST_SESSION_KEY);
                }

            function storedRoomSessionReconnectDeadlineMs(session) {
                const directDeadline = Number(session && session.reconnectDeadlineMs) || 0;
                if (directDeadline) {
                    return directDeadline;
                }
                const participant = participantForId(session && session.snapshot, session && session.participantId);
                if (participant && participant.connected === false) {
                    return Number(participant.reconnectDeadlineMs) || 0;
                }
                return 0;
            }

            function markStoredRoomSessionReconnectDeadline(session, deadlineMs, reason) {
                if (!session || session.intentionalLeave === true
                        || session.source !== MULTIPLAYER_ROOM_SOURCE_ROOM_UI
                        || (session.phase !== "lobby" && session.phase !== "reconnect-handshake")) {
                    return false;
                }
                session.reconnectDeadlineMs = deadlineMs;
                session.reconnectDeadlineReason = String(reason || "");
                saveMultiplayerRoomSession(session);
                return true;
            }

            function storedRoomSessionMatchesIdentity(session, normalizedRoomName, roomSecret, playerName) {
                return !!session
                        && session.protocolVersion === MULTIPLAYER_ROOM_PROTOCOL_VERSION
                        && session.source === MULTIPLAYER_ROOM_SOURCE_ROOM_UI
                        && session.normalizedRoomName === normalizedRoomName
                        && session.roomSecret === roomSecret
                        && session.playerName === playerName;
