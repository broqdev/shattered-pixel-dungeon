                runtime.handshakeRetryId = window.setInterval(() => {
                    if (multiplayerRoomRuntime !== runtime) {
                        clearRoomHandshakeRetry(runtime);
                        return;
                    }
                    sendRoomHandshakeRequests(runtime);
                    logWebParity("multiplayer room handshake retry", {
                        mode: session.mode,
                        phase: session.phase,
                        roomName: session.roomName
                    });
                }, MULTIPLAYER_ROOM_HANDSHAKE_RETRY_MS);
            }

            function rejectRoomJoin(runtime, reason, peerId, requestId, targetParticipantId) {
                sendEncryptedRoomPayload(runtime, {
                    type: "room-join-rejected",
                    status: "rejected",
                    requestId,
                    targetParticipantId,
                    reason,
                    snapshotRoomEpoch: runtime.session.roomEpoch,
                    snapshot: stripMultiplayerRoomSnapshotSecrets(runtime.session.snapshot || null)
                }, peerId);
            }

            function rejectRoomReconnect(runtime, reason, peerId, requestId, targetParticipantId) {
                sendEncryptedRoomPayload(runtime, {
                    type: "room-reconnect-rejected",
                    status: "rejected",
                    requestId,
                    targetParticipantId,
                    reason,
                    snapshotRoomEpoch: runtime.session.roomEpoch,
                    snapshot: stripMultiplayerRoomSnapshotSecrets(runtime.session.snapshot || null)
                }, peerId);
            }

            function reconnectRejectionMessage(reason) {
                if (reconnectRejectedReasonIsExpired(reason)) {
                    return "Reconnect expired. Join again.";
                }
                switch (reason) {
                    case "invalid reconnect token":
                        return "Reconnect token is unavailable. Join again.";
                    case "participant already connected":
                        return "This room session is already connected.";
                    default:
                        return reason || "Reconnect rejected.";
                }
            }

            function reconnectRejectedReasonIsExpired(reason) {
                const normalized = String(reason || "").trim().toLowerCase();
                return normalized === "reconnect expired"
                        || normalized === "reconnect expired. join again.";
            }

            function rejectRoomCreateConflict(runtime) {
                const session = runtime && runtime.session || window.__shpdMultiplayerRooms.currentSession;
                cleanupMultiplayerRoomEntry("room-name-conflict");
                if (session) {
                    removeMultiplayerRoomSession(session);
                    if (window.__shpdMultiplayerRooms.currentSession === session) {
                        window.__shpdMultiplayerRooms.currentSession = null;
                    }
                }
                pushMultiplayerRoomEvent("room-error", ["room name conflict"]);
            }

            function sendParticipantIntentResult(runtime, intent, result, peerId) {
                sendEncryptedRoomPayload(runtime, {
                    type: "room-intent-result",
                    status: result && result.ok ? "accepted" : "rejected",
                    intentId: intent && intent.intentId,
                    targetParticipantId: intent && intent.participantId,
                    reason: result && result.reason || "",
                    snapshotRoomEpoch: runtime.session.roomEpoch,
                    snapshot: stripMultiplayerRoomSnapshotSecrets(runtime.session.snapshot || null)
                }, peerId);
            }

            function promoteCreateProbeToOwner(runtime) {
                const session = runtime.session;
                session.phase = "lobby";
                session.roomEpoch = 1;
                session.roomOwnerParticipantId = session.participantId;
                session.snapshot = initialMultiplayerRoomSnapshot(session);
                acceptStoredRoomIdentityEntry(session);
                saveMultiplayerRoomSession(session);
                window.__shpdMultiplayerRooms.currentSession = session;
                pushMultiplayerRoomEvent("room-status", ["Room created."]);
                pushRoomLobbyEvent(session);
                sendCurrentRoomSnapshot(runtime);
                logWebParity("multiplayer room created", {
                    source: session.source,
                    roomName: session.roomName,
                    participantSource: MULTIPLAYER_ROOM_SOURCE_ROOM_UI
                });
            }

            function handleAcceptedRoomSnapshot(runtime, snapshot) {
                const session = runtime.session;
                acceptStoredRoomIdentityEntry(session);
                applyRoomSnapshotToSession(session, snapshot);
                window.__shpdMultiplayerRooms.currentSession = session;
                if (runtime.timerId) {
                    window.clearTimeout(runtime.timerId);
                    runtime.timerId = 0;
                }
                clearRoomHandshakeRetry(runtime);
                pushMultiplayerRoomEvent("room-status", [
                    session.mode === "reconnect" || session.mode === "rejoin"
                            ? "Room reconnected." : "Room joined."
                ]);
                pushRoomLobbyEvent(session);
                if (session.mode === "reconnect" && session.roomOwnerParticipantId === session.participantId) {
                    sendCurrentRoomSnapshot(runtime);
                }
            }

            function handleUpdatedRoomSnapshot(runtime, snapshot) {
                const session = runtime.session;
                applyRoomSnapshotToSession(session, snapshot);
                window.__shpdMultiplayerRooms.currentSession = session;
                pushRoomLobbyEvent(session);
            }

            async function handleEncryptedRoomMessage(runtime, envelope, peerId) {
                const session = runtime.session;
                const payload = await decryptMultiplayerRoomEnvelope(session.roomSecret, envelope);
                if (!payload || payload.roomProtocol !== "room-v1"
                        || payload.roomName !== session.normalizedRoomName
                        || payload.senderParticipantId === session.participantId) {
                    return;
                }
                if (!await verifyMultiplayerRoomEnvelope(session, envelope, payload)) {
                    return;
                }
                runtime.peerParticipants = runtime.peerParticipants || {};
                if (peerId && payload.senderParticipantId) {
                    runtime.peerParticipants[peerId] = payload.senderParticipantId;
                }
                if (session.intentionalLeave === true
                        && (payload.type === "room-snapshot" || payload.type === "room-launch")) {
                    return;
                }

                if (payload.type === "room-snapshot" && payload.snapshot) {
                    if (!snapshotMatchesRoomSession(session, payload.snapshot)) {
                        return;
                    }
                    if (session.phase === "create-probe") {
                        if (payload.snapshot.roomPhase === "active") {
                            rejectRoomCreateConflict(runtime);
                            return;
                        }
                        const remoteRaceKey = await raceKeyFromSnapshot(session, payload.snapshot);
                        const remoteCreatorParticipantId = payload.snapshot.creatorParticipantId
                                || payload.snapshot.roomOwnerParticipantId;
                        if (remoteCreateRaceBeatsSession(session, remoteRaceKey, remoteCreatorParticipantId, true)) {
                            rejectRoomCreateConflict(runtime);
                        } else {
                            sendCreateProbe(runtime, peerId);
                        }
                    } else if (session.phase === "join-handshake") {
                        if (snapshotCanUpdateRoomSession(session, payload.snapshot, "lobby")
                                && snapshotContainsParticipant(payload.snapshot, session.participantId)) {
                            handleAcceptedRoomSnapshot(runtime, payload.snapshot);
                        }
                    } else if (session.phase === "reconnect-handshake") {
                        const participant = participantForId(payload.snapshot, session.participantId);
                        if (snapshotCanUpdateRoomSession(session, payload.snapshot, "lobby")
                                && participant && participant.connected !== false) {
                            handleAcceptedRoomSnapshot(runtime, payload.snapshot);
                        }
                    } else if (session.phase === "lobby"
                            && snapshotCanUpdateLobbyFromSender(session, payload.snapshot,
                                    payload.senderParticipantId)) {
                        handleUpdatedRoomSnapshot(runtime, payload.snapshot);
                    } else if (session.phase === "lobby"
                            && session.roomOwnerParticipantId === session.participantId) {
                        const remoteRaceKey = await raceKeyFromSnapshot(session, payload.snapshot);
                        const remoteCreatorParticipantId = payload.snapshot.creatorParticipantId
                                || payload.snapshot.roomOwnerParticipantId;
                        if (remoteCreateRaceBeatsSession(session, remoteRaceKey, remoteCreatorParticipantId, false)) {
                            rejectRoomCreateConflict(runtime);
                        } else {
                            sendCurrentRoomSnapshot(runtime, peerId);
                        }
                    }
                    return;
                }

                if (payload.type === "room-launch" && payload.snapshot
                        && session.phase === "lobby"
                        && payload.senderParticipantId === session.roomOwnerParticipantId
                        && payload.snapshot.roomOwnerParticipantId === payload.senderParticipantId
                        && snapshotCanUpdateRoomSession(session, payload.snapshot, "active")
                        && snapshotContainsParticipant(payload.snapshot, session.participantId)) {
                    applyRoomSnapshotToSession(session, payload.snapshot);
                    session.phase = "active";
                    window.__shpdMultiplayerRooms.currentSession = session;
                    installLaunchedMultiplayerRuntime(session);
                    pushRoomLaunchEvent(session);
                    return;
                }

                if (payload.type === "room-create-probe" && session.phase === "active"
                        && session.roomOwnerParticipantId === session.participantId && session.snapshot) {
                    sendCurrentRoomSnapshot(runtime, peerId);
                    return;
                }

                if (payload.type === "room-create-probe" && session.phase === "create-probe") {
                    const remoteRaceKey = await raceKeyFromCreateProbe(session, payload);
                    if (!remoteRaceKey) {
                        return;
                    }
                    if (remoteCreateRaceBeatsSession(session, remoteRaceKey,
                            payload.creatorParticipantId, false)) {
                        rejectRoomCreateConflict(runtime);
                    } else {
                        sendCreateProbe(runtime, peerId);
                    }
                    return;
                }

                if (payload.type === "room-create-probe" && session.phase === "lobby"
                        && session.roomOwnerParticipantId === session.participantId) {
                    sendCurrentRoomSnapshot(runtime, peerId);
                    return;
                }

                if (payload.type === "room-join-request" && session.phase === "active"
                        && session.roomOwnerParticipantId === session.participantId && session.snapshot) {
                    const participant = payload.participant;
                    rejectRoomJoin(runtime, "game already started", peerId, String(payload.requestId || ""),
                            participant && participant.participantId);
                    return;
                }

                if (payload.type === "room-reconnect-request" && session.phase === "lobby"
                        && session.snapshot
                        && (session.roomOwnerParticipantId === session.participantId
                        || String(payload.targetParticipantId || "") === session.snapshot.roomOwnerParticipantId)) {
                    const requestId = String(payload.requestId || "");
                    const targetParticipantId = String(payload.targetParticipantId || "");
                    const result = applyParticipantReconnect(runtime, payload, peerId);
                    if (!result.ok) {
                        rejectRoomReconnect(runtime, result.reason, peerId, requestId, targetParticipantId);
                    }
                    return;
                }

                if (payload.type === "room-join-request" && session.phase === "lobby"
                        && session.roomOwnerParticipantId === session.participantId && session.snapshot) {
                    const participant = payload.participant;
                    const requestId = String(payload.requestId || "");
                    const targetParticipantId = participant && participant.participantId;
                    if (session.snapshot.roomPhase !== "lobby") {
                        rejectRoomJoin(runtime, "game already started", peerId, requestId, targetParticipantId);
                        return;
                    }
                    if (!participant || !participant.authPublicKey
                            || participant.participantId !== payload.senderParticipantId) {
                        rejectRoomJoin(runtime, "invalid participant identity", peerId, requestId,
                                targetParticipantId);
                        return;
                    }
                    if (!addParticipantToRoomSnapshot(session.snapshot, participant)) {
                        rejectRoomJoin(runtime, "room full", peerId, requestId, targetParticipantId);
                        return;
                    }
                    session.roomEpoch = Number(session.snapshot && session.snapshot.roomEpoch) || session.roomEpoch;
                    saveMultiplayerRoomSession(session);
                    pushRoomLobbyEvent(session);
                    if (peerId) {
                        sendCurrentRoomSnapshot(runtime, peerId);
                    }
                    sendCurrentRoomSnapshot(runtime);
                    return;
                }

                if (payload.type === "room-participant-intent" && session.phase === "lobby"
                        && session.roomOwnerParticipantId === session.participantId && session.snapshot) {
                    const intent = payload.intent || {};
                    if (intent.participantId !== payload.senderParticipantId) {
                        return;
                    }
                    if (intent.action === "leave") {
                        if (!participantIntentMatchesRoomEpoch(session, intent)) {
                            sendParticipantIntentResult(runtime, intent,
                                    { ok: false, reason: "stale room state" }, peerId);
                            return;
                        }
                        await applyParticipantLeave(runtime, intent.participantId);
                        return;
                    }
                    const result = applyParticipantIntent(runtime, intent);
                    if (!result.ok) {
                        sendParticipantIntentResult(runtime, intent, result, peerId);
                    }
                    return;
                }

                if (payload.type === "room-intent-result") {
                    if (payload.targetParticipantId !== session.participantId) {
                        return;
                    }
                    const intentResultKey = JSON.stringify([
                        payload.senderParticipantId || "",
                        payload.targetParticipantId || "",
                        payload.intentId || "",
                        payload.status || "",
                        payload.reason || "",
                        payload.snapshotRoomEpoch || ""
                    ]);
                    runtime.handledIntentResultIds = runtime.handledIntentResultIds || {};
                    if (runtime.handledIntentResultIds[intentResultKey]) {
                        return;
                    }
                    runtime.handledIntentResultIds[intentResultKey] = true;
                    if (payload.status === "rejected") {
                        pushMultiplayerRoomEvent("room-error", [payload.reason || "Room action rejected."]);
                    }
                    return;
                }

                if (payload.type === "room-reconnect-rejected" && session.phase === "reconnect-handshake") {
                    if (payload.targetParticipantId !== session.participantId
                            || payload.requestId !== session.reconnectRequestId) {
                        return;
                    }
                    const retryFreshJoin = session.mode !== "rejoin"
                            && reconnectRejectedReasonIsExpired(payload.reason);
                    removeStoredRoomSessionsForIdentity(session);
                    removeMultiplayerRoomSession(session);
                    if (retryFreshJoin) {
                        const freshSession = await createFreshJoinSessionFromExpiredReconnect(session);
                        runtime.session = freshSession;
                        window.__shpdMultiplayerRooms.currentSession = freshSession;
                        if (runtime.timerId) {
                            window.clearTimeout(runtime.timerId);
                            runtime.timerId = 0;
                        }
                        pushMultiplayerRoomEvent("room-status", ["Reconnect expired. Joining as a new participant..."]);
                        sendJoinRequest(runtime, peerId);
                        runtime.timerId = window.setTimeout(() => {
                            if (multiplayerRoomRuntime === runtime && freshSession.phase === "join-handshake") {
                                cleanupMultiplayerRoomEntry("expired-reconnect-fresh-join-timeout");
                            window.__shpdMultiplayerRooms.currentSession = null;
                                pushMultiplayerRoomEvent("room-error", ["Owner did not respond."]);
                            }
                        }, MULTIPLAYER_ROOM_JOIN_TIMEOUT_MS);
                        startRoomHandshakeRetry(runtime);
                        return;
                    }
                    cleanupMultiplayerRoomEntry("reconnect-rejected");
                    window.__shpdMultiplayerRooms.currentSession = null;
                    pushMultiplayerRoomEvent("room-error", [reconnectRejectionMessage(payload.reason)]);
                    return;
                }

                if (payload.type === "room-join-rejected" && session.phase === "join-handshake") {
                    if (payload.targetParticipantId !== session.participantId
                            || payload.requestId !== session.joinRequestId) {
                        return;
                    }
                    cleanupMultiplayerRoomEntry("join-rejected");
                    removeMultiplayerRoomSession(session);
                    window.__shpdMultiplayerRooms.currentSession = null;
                    pushMultiplayerRoomEvent("room-error", [payload.reason || "Join rejected."]);
                    return;
                }
            }

            function startMultiplayerRoomTransport(session) {
                cleanupMultiplayerRoomEntry("new-room-request");
                pushMultiplayerRoomEvent("room-status", [
                    session.mode === "create"
                            ? "Checking room name conflict..."
                            : (session.mode === "reconnect" || session.mode === "rejoin"
                                    ? "Reconnecting to room..." : "Finding room owner...")
                ]);
                loadMultiplayerTrysteroModule().then((trystero) => {
                    const room = trystero.joinRoom(MULTIPLAYER_TRYSTERO_CONFIG, session.transportRoomId);
                    const roomMessage = room.makeAction("room-msg");
                    const runtime = {
                        session,
                        room,
                        sendRoomMessage: roomMessage[0],
                        timerId: 0,
                        launchTimerId: 0,
                        disconnectCleanupTimers: {},
                        peerParticipants: {},
                        handledIntentIds: {},
                        handledIntentResultIds: {},
                        roomPeers: new Set(),
                        handshakeRetryId: 0
                    };
                    multiplayerRoomRuntime = runtime;
                    window.addEventListener("pagehide", cleanupMultiplayerRoomEntryOnPageHide, { capture: true });
                    window.addEventListener("beforeunload", cleanupMultiplayerRoomEntryOnBeforeUnload, { capture: true });
                    const getRoomMessage = roomMessage[1];
                    getRoomMessage((envelope, peerId) => {
                        handleEncryptedRoomMessage(runtime, envelope, peerId);
                    });
                    room.onPeerJoin((peerId) => {
                        runtime.roomPeers.add(peerId);
                        const activeSession = runtime.session;
                        if (activeSession.phase === "create-probe") {
                            sendCreateProbe(runtime, peerId);
                        } else if (activeSession.phase === "join-handshake") {
                            sendRoomHandshakeRequest(runtime, peerId);
                        } else if (activeSession.phase === "reconnect-handshake") {
                            sendRoomHandshakeRequest(runtime, peerId);
                        } else if (activeSession.phase === "lobby"
                                && activeSession.roomOwnerParticipantId === activeSession.participantId) {
                            sendCurrentRoomSnapshot(runtime, peerId);
                        }
                    });
                    room.onPeerLeave((peerId) => {
                        runtime.roomPeers.delete(peerId);
                        const activeSession = runtime.session;
                        if (activeSession.intentionalLeave === true) {
                            return;
                        }
                        const participantId = runtime.peerParticipants[peerId] || "";
                        delete runtime.peerParticipants[peerId];
                        if (activeSession.phase === "lobby"
                                && activeSession.roomOwnerParticipantId === activeSession.participantId
                                && participantId) {
                            markLobbyParticipantDisconnected(runtime, participantId);
                        } else if (activeSession.phase === "lobby"
                                && participantId === activeSession.roomOwnerParticipantId) {
                            markLobbyOwnerDisconnected(runtime, participantId);
                        }
                    });

                    if (session.phase === "create-probe") {
                        sendCreateProbe(runtime);
                        runtime.timerId = window.setTimeout(() => {
                            if (multiplayerRoomRuntime === runtime && session.phase === "create-probe") {
                                promoteCreateProbeToOwner(runtime);
                            }
                        }, MULTIPLAYER_ROOM_CREATE_PROBE_MS);
                    } else if (session.phase === "reconnect-handshake") {
                        sendRoomHandshakeRequests(runtime);
                        startRoomHandshakeRetry(runtime);
                        runtime.timerId = window.setTimeout(() => {
                            if (multiplayerRoomRuntime === runtime && session.phase === "reconnect-handshake") {
                                if (session.mode === "rejoin") {
                                    clearStoredRoomRejoinCandidate(session);
                                    window.__shpdMultiplayerRooms.currentSession = null;
                                }
                                cleanupMultiplayerRoomEntry("reconnect-timeout");
                                pushMultiplayerRoomEvent("room-error", ["Owner did not respond."]);
                            }
                        }, MULTIPLAYER_ROOM_JOIN_TIMEOUT_MS);
                    } else if (session.phase === "lobby"
                            && session.roomOwnerParticipantId === session.participantId
                            && session.snapshot) {
                        acceptStoredRoomIdentityEntry(session);
                        saveMultiplayerRoomSession(session);
                        pushMultiplayerRoomEvent("room-status", ["Room reconnected."]);
                        pushRoomLobbyEvent(session);
                        sendCurrentRoomSnapshot(runtime);
                    } else {
                        sendRoomHandshakeRequests(runtime);
                        startRoomHandshakeRetry(runtime);
                        runtime.timerId = window.setTimeout(() => {
                            if (multiplayerRoomRuntime === runtime && session.phase === "join-handshake") {
                                cleanupMultiplayerRoomEntry("join-timeout");
                                pushMultiplayerRoomEvent("room-error", ["Owner did not respond."]);
                            }
                        }, MULTIPLAYER_ROOM_JOIN_TIMEOUT_MS);
                    }
                }).catch((error) => {
                    cleanupMultiplayerRoomEntry("startup-failure");
                    const message = browserDataBackupErrorMessage(error);
                    window.__shpdMultiplayerRooms.lastError = message;
                    pushMultiplayerRoomEvent("room-error", [message]);
                    logWebParity("multiplayer room transport failed", {
                        mode: session.mode,
                    roomName: session.roomName,
                        error: message
                    });
                });
            }

            function startRequestedMultiplayerRoomSession(session, sessionSource) {
                    if (session.source !== sessionSource) {
                        session.source = sessionSource;
                        saveMultiplayerRoomSession(session);
                    }
                    window.__shpdMultiplayerRooms.currentSession = session;
                    window.__shpdMultiplayerRooms.pendingRequest = null;
                    if (session.mode === "active-return" && session.phase === "active") {
                        const restoreResult = restoreActiveRoomRunSnapshot(session);
                        if (!restoreResult.ok) {
                            removeStoredActiveRoomSessionForConfig(launchedMultiplayerConfigForSession(session));
                            removeActiveRunSnapshotForSession(session);
                            clearRoomActiveMultiplayerConfig();
                            window.__shpdMultiplayerRooms.currentSession = null;
                            pushMultiplayerRoomEvent("room-error", [restoreResult.message]);
                            logWebParity("multiplayer active room player return failed", {
                                source: session.source,
                                roomName: session.roomName,
                                participantId: session.participantId,
                                error: restoreResult.message
                            });
                            return session;
                        }
                        pushMultiplayerRoomEvent("room-status", ["Room rejoined. Reloading saved run..."]);
                        saveRoomActiveMultiplayerConfig(launchedMultiplayerConfigForSession(session));
                        window.setTimeout(() => window.location.replace(multiplayerUrlWithoutCloneFlag()), 100);
                        logWebParity("multiplayer active room player returned", {
                            source: session.source,
                            roomName: session.roomName,
                            participantId: session.participantId,
                            result: restoreResult.result
                        });
                        return session;
                    }
                    startMultiplayerRoomTransport(session);
                    logWebParity("multiplayer room session prepared", {
                        source: session.source,
                        mode: session.mode,
                    roomName: session.roomName,
                        phase: session.phase
                    });
                    return session;
            }

            function requestMultiplayerRoomSession(mode, roomName, password, playerName, source) {
                const input = { roomName, password, playerName };
                const sessionSource = source === MULTIPLAYER_ROOM_SOURCE_DEV_URL
                        ? MULTIPLAYER_ROOM_SOURCE_DEV_URL
                        : MULTIPLAYER_ROOM_SOURCE_ROOM_UI;
                clearMultiplayerRoomEvents();
                window.__shpdMultiplayerRooms.lastError = "";
                window.__shpdMultiplayerRooms.pendingRequest = {
                    mode,
                    roomName: String(roomName || ""),
                    playerName: String(playerName || ""),
                    requestedAt: Date.now()
                };
                return createMultiplayerRoomSession(mode, input).then((session) =>
                    startRequestedMultiplayerRoomSession(session, sessionSource)).catch((error) => {
                    window.__shpdMultiplayerRooms.pendingRequest = null;
                    window.__shpdMultiplayerRooms.lastError = browserDataBackupErrorMessage(error);
                    pushMultiplayerRoomEvent("room-error", [window.__shpdMultiplayerRooms.lastError]);
                    logWebParity("multiplayer room session failed", {
                        mode,
                        roomName: String(roomName || ""),
                        error: window.__shpdMultiplayerRooms.lastError
                    });
                    return null;
                });
            }

            function requestMultiplayerRoomRejoin(source) {
                const sessionSource = source === MULTIPLAYER_ROOM_SOURCE_DEV_URL
                        ? MULTIPLAYER_ROOM_SOURCE_DEV_URL
                        : MULTIPLAYER_ROOM_SOURCE_ROOM_UI;
                clearMultiplayerRoomEvents();
                window.__shpdMultiplayerRooms.lastError = "";
                window.__shpdMultiplayerRooms.pendingRequest = {
                    mode: "rejoin",
                    roomName: "",
                    playerName: "",
                    requestedAt: Date.now()
                };
                return createMultiplayerRoomRejoinSession().then((session) => {
                    window.__shpdMultiplayerRooms.pendingRequest.roomName = String(session.roomName || "");
                    window.__shpdMultiplayerRooms.pendingRequest.playerName = String(session.playerName || "");
                    return startRequestedMultiplayerRoomSession(session, sessionSource);
                }).catch((error) => {
                    clearStoredRoomRejoinCandidate();
                    window.__shpdMultiplayerRooms.pendingRequest = null;
                    window.__shpdMultiplayerRooms.lastError = browserDataBackupErrorMessage(error);
                    pushMultiplayerRoomEvent("room-error", [window.__shpdMultiplayerRooms.lastError]);
                    logWebParity("multiplayer room rejoin failed", {
                        error: window.__shpdMultiplayerRooms.lastError
                    });
                    return null;
                });
            }

            function finishMultiplayerRoomLeave(runtime, session) {
                const stillCurrentRuntime = multiplayerRoomRuntime === runtime;
                const stillCurrentSession = window.__shpdMultiplayerRooms.currentSession === session;
                if (stillCurrentRuntime || stillCurrentSession) {
                    markStoredRoomIdentityIntentionallyLeft(session);
                    removeStoredRoomSessionsForIdentity(session);
                }
                removeMultiplayerRoomSession(session);
                if (stillCurrentRuntime) {
                    cleanupMultiplayerRoomEntryIfCurrent(runtime, "manual");
                }
                if (stillCurrentSession) {
                    pushMultiplayerRoomEvent("room-status", ["Left room."]);
                    window.__shpdMultiplayerRooms.currentSession = null;
                }
            }

            function requestMultiplayerRoomLeave() {
                const runtime = multiplayerRoomRuntime;
                const session = runtime && runtime.session;
                if (!runtime || !session || session.phase !== "lobby" || !session.snapshot) {
                    if (session) {
                        session.intentionalLeave = true;
                        finishMultiplayerRoomLeave(runtime, session);
                    } else {
                        cleanupMultiplayerRoomEntry("manual");
                        pushMultiplayerRoomEvent("room-status", ["Left room."]);
                        window.__shpdMultiplayerRooms.currentSession = null;
                    }
                    return;
                }
                session.intentionalLeave = true;
                markStoredRoomIdentityIntentionallyLeft(session);
                removeStoredRoomSessionsForIdentity(session);
                removeMultiplayerRoomSession(session);
                if (session.roomOwnerParticipantId === session.participantId) {
                    applyParticipantLeave(runtime, session.participantId, false).finally(() => {
                        window.setTimeout(() => {
                            finishMultiplayerRoomLeave(runtime, session);
                        }, 50);
                    });
                    return;
                }
                pushMultiplayerRoomEvent("room-status", ["Leaving room..."]);
                sendParticipantIntentPayload(runtime, "leave", "").finally(() => window.setTimeout(() => {
                    finishMultiplayerRoomLeave(runtime, session);
                }, 50));
            }

            function clearReadyAndCountdownForRuleChange(snapshot) {
                clearReadyAndCountdown(snapshot);
            }

            function nextParticipantIntent(session, action, value) {
                session.intentSeq = (Number(session.intentSeq) || 0) + 1;
                saveMultiplayerRoomSession(session);
                return {
                    intentId: session.participantId + "-" + session.intentSeq,
                    participantId: session.participantId,
                    action,
                    value: value == null ? "" : String(value),
                    roomEpoch: session.roomEpoch
                };
            }

            function sendParticipantIntentPayload(runtime, action, value) {
                const session = runtime.session;
                const intent = nextParticipantIntent(session, action, value);
                return sendEncryptedRoomPayload(runtime, {
                    type: "room-participant-intent",
                    intent
                });
            }

            function sendParticipantIntent(runtime, action, value) {
                sendParticipantIntentPayload(runtime, action, value);
                pushMultiplayerRoomEvent("room-status", ["Waiting for room owner..."]);
                return true;
            }

            function requestMultiplayerRoomAction(action, value) {
                const runtime = multiplayerRoomRuntime;
                const session = runtime && runtime.session;
                const snapshot = session && session.snapshot;
                if (!runtime || !session || !snapshot || session.phase !== "lobby") {
                    return false;
                }
                if (action === "ready-toggle" || action === "hero-choice") {
                    if (session.roomOwnerParticipantId === session.participantId) {
                        const result = applyParticipantIntent(runtime, nextParticipantIntent(session, action, value));
                        if (!result.ok) {
                            pushMultiplayerRoomEvent("room-error", [result.reason || "Room action rejected."]);
                        }
                        return result.ok;
                    }
                    return sendParticipantIntent(runtime, action, value);
                }
                if (snapshot.roomOwnerParticipantId !== session.participantId) {
                    pushMultiplayerRoomEvent("room-status", ["Only the room owner can change this setting."]);
                    return false;
                }
                if (action === "start-toggle") {
                    return applyStartToggle(runtime).ok;
                }

                if (action === "floor-turns") {
                    const turns = Number(value) || MULTIPLAYER_ROOM_DEFAULT_FLOOR_CHASE_TURNS;
                    if (turns < 10 || turns > 100 || turns % 10 !== 0) {
                        return false;
                    }
                    if (snapshot.floorChaseTurns === turns && snapshot.floorChaseInfinite !== true) {
                        return true;
                    }
                    snapshot.floorChaseTurns = turns;
                    snapshot.floorChaseInfinite = false;
                } else if (action === "floor-infinite") {
                    const infinite = value === true || String(value) === "true";
                    if (snapshot.floorChaseInfinite === infinite) {
                        return true;
                    }
                    snapshot.floorChaseInfinite = infinite;
                } else {
                    return false;
                }

                snapshot.roomEpoch = (Number(snapshot.roomEpoch) || 1) + 1;
                session.roomEpoch = snapshot.roomEpoch;

            const multiplayerDevUrlRoomActionRunner = {

                const action = (separator >= 0 ? token.substring(0, separator) : token).trim();

                        return devUrlRoomActionError("Invalid finite turn value for room action.");
                    }
                    value = String(turns);

                    const normalized = value ? value.toLowerCase() : "true";
                    if (normalized === "true" || normalized === "1" || normalized === "yes") {
                        value = "true";
                    } else if (normalized === "false" || normalized === "0" || normalized === "no") {

                for (let i = 0; i < actionValues.length; i++) {

            function devUrlRoomActionSpec(params) {

                if (actions.error) {

                    roomName: devUrlRoomParam(params, "roomName") || devUrlRoomParam(params, "room"),
                    password: devUrlRoomParam(params, "roomPassword"),
                    playerName: devUrlRoomParam(params, "playerName") || devUrlRoomParam(params, "id"),
                    actions: actions.actions

            function resetDevUrlRoomActionRunner(spec) {

                multiplayerDevUrlRoomActionRunner.error = "";
                multiplayerDevUrlRoomActionRunner.spec = spec;
                multiplayerDevUrlRoomActionRunner.steps = [];
            }

            function finishDevUrlRoomActionRunner(error) {
                multiplayerDevUrlRoomActionRunner.active = false;
                multiplayerDevUrlRoomActionRunner.done = true;
                multiplayerDevUrlRoomActionRunner.error = error || "";

                        ? "multiplayer dev-url room actions failed"
                        : "multiplayer dev-url room actions complete", {

                    steps: multiplayerDevUrlRoomActionRunner.steps.length

            function recordDevUrlRoomActionStep(action, status, detail) {
                const step = {
                    action,
                    status,

                    at: Date.now()

            function sleepDevUrlRoomActionRunner(ms) {

            async function waitForDevUrlRoomState(label, predicate, timeoutMs) {
                const deadline = Date.now() + timeoutMs;
                while (Date.now() <= deadline) {
                    const runtime = multiplayerRoomRuntime;
                    const session = runtime && runtime.session || window.__shpdMultiplayerRooms.currentSession;
                    const snapshot = session && session.snapshot;
                    if (predicate(runtime, session, snapshot)) {

                    if (window.__shpdMultiplayerRooms.lastError) {

                }

            function devUrlRoomParticipantRole(snapshot, participantId) {
                if (!snapshot || !participantId) {

            }

            function devUrlRoomParticipantReady(snapshot, participantId) {
                const seatIndex = playerSeatIndexForParticipant(snapshot, participantId);
                return seatIndex >= 0 && snapshot.playerSeats[seatIndex].ready === true;
            }

            function devUrlRoomParticipantHero(snapshot, participantId) {
                const seatIndex = playerSeatIndexForParticipant(snapshot, participantId);
                return seatIndex >= 0 ? snapshot.playerSeats[seatIndex].heroChoice || "" : "";
            }

            async function waitForDevUrlRoomActionSettled(action, value, before) {
                return waitForDevUrlRoomState("room action " + action, (runtime, session, snapshot) => {
                    if (action === "leave") {
                        return !runtime && !window.__shpdMultiplayerRooms.currentSession;
                    }
                    if (!session || !snapshot) {
                        return false;
                    }
                    if (action === "start-toggle") {
                        if (session.phase === "active" || snapshot.roomPhase === "active") {
                            return true;
                        }
                        const hasCountdown = !!(snapshot.countdown && snapshot.countdown.deadlineMs);
                        return before.countdown ? !hasCountdown : false;
                    }
                    if (action === "floor-turns") {
                        return Number(snapshot.floorChaseTurns) === Number(value)
                                && snapshot.floorChaseInfinite !== true;
                    }
                    if (action === "floor-infinite") {
                        return snapshot.floorChaseInfinite === (value === true || String(value) === "true");
                    }
                    if (action === "wait-connections") {
                        return (snapshot.participants || []).length >= Number(value);
                    }
                    if (action === "ready-toggle") {
                        return devUrlRoomParticipantReady(snapshot, session.participantId) !== before.ready;
                    }
                    if (action === "hero-choice") {
                        return devUrlRoomParticipantHero(snapshot, session.participantId) === value;
                    }

            async function applyDevUrlRoomAction(actionSpec) {
                const action = actionSpec.action;
                const value = actionSpec.value;

                while (Date.now() <= deadline) {

                            (runtime, session, snapshot) => {
                                if (action === "leave") {
                                    return !!session;
                            }
                                return !!runtime && !!session && !!snapshot && session.phase === "lobby";
                            },
                            MULTIPLAYER_ROOM_DEV_URL_ACTION_TIMEOUT_MS);
                    const before = {
                        role: devUrlRoomParticipantRole(state.snapshot, state.session.participantId),
                        ready: devUrlRoomParticipantReady(state.snapshot, state.session.participantId),
                        countdown: !!(state.snapshot
                                && state.snapshot.countdown
                                && state.snapshot.countdown.deadlineMs)
                    };
                    const accepted = action === "wait-connections"
                            ? true
                            : action === "leave"
                            ? (requestMultiplayerRoomLeave(), true)
                            : requestMultiplayerRoomAction(action, value);
                    recordDevUrlRoomActionStep(action, accepted ? "accepted" : "retry", value);
                    if (accepted) {
                        try {
                            await waitForDevUrlRoomActionSettled(action, value, before);
                        } catch (error) {
                            if (action === "start-toggle" && !before.countdown && Date.now() <= deadline) {
                                recordDevUrlRoomActionStep(action, "retry", browserDataBackupErrorMessage(error));
                                await sleepDevUrlRoomActionRunner(MULTIPLAYER_ROOM_DEV_URL_ACTION_RETRY_MS);
                                continue;
                            }
                            throw error;
                        }
                        recordDevUrlRoomActionStep(action, "settled", value);
                        return;
                    }
                    await sleepDevUrlRoomActionRunner(MULTIPLAYER_ROOM_DEV_URL_ACTION_RETRY_MS);
                }

            }

            async function runDevUrlRoomActions(spec) {

                if (spec.error) {
                    finishDevUrlRoomActionRunner(spec.error);
                    return;

                    mode: spec.mode,
                    roomName: spec.roomName,
                    actionCount: spec.actions.length

                        spec.password, spec.playerName, MULTIPLAYER_ROOM_SOURCE_DEV_URL);
                if (!session) {

                            || "Room entry failed.");
                    return;

                    await waitForDevUrlRoomState("room lobby", (runtime, currentSession, snapshot) =>
                            !!runtime && currentSession === session && !!snapshot
                            && currentSession.phase === "lobby",
                            MULTIPLAYER_ROOM_DEV_URL_ACTION_TIMEOUT_MS);
                    for (const action of spec.actions) {
                        await applyDevUrlRoomAction(action);
                    }

                } catch (error) {

                }

                currentSession: null,
                pendingRequest: null,

                prewarmTransport: prewarmMultiplayerTrysteroModule,

                        if (seq <= lastSeq) {
                            return;

                        if (lastSeq > 0 && seq !== lastSeq + 1) {

                            enqueueReplayJavaEvent(data, kind);
                        }
                    }

                    function clearActivePeerDisconnect(remotePlayerId) {
                        remotePlayerId = String(remotePlayerId || "");
                        if (!remotePlayerId || state.activeTimedOutPlayers.has(remotePlayerId)) {
                            return false;
                        }
                        const timeoutId = state.activeDisconnectTimers.get(remotePlayerId);
                        if (timeoutId) {
                            window.clearTimeout(timeoutId);
                            state.activeDisconnectTimers.delete(remotePlayerId);
                        }
                        if (!state.activeDisconnectedPlayers.delete(remotePlayerId)) {
                            return false;
                        }
                        javaEvents.push(multiplayerEncodeEvent("peer-returned", [remotePlayerId]));
                        pushStatus("Player " + remotePlayerId + " reconnected before timeout.");
                        return true;
                    }

                    function scheduleActivePeerDisconnectTimeout(remotePlayerId) {
                        remotePlayerId = String(remotePlayerId || "");
                        if (!remotePlayerId || state.activeTimedOutPlayers.has(remotePlayerId)) {
                            return;
                        }
                        const oldTimeoutId = state.activeDisconnectTimers.get(remotePlayerId);
                        if (oldTimeoutId) {
                            window.clearTimeout(oldTimeoutId);
                        }
                        state.activeDisconnectedPlayers.add(remotePlayerId);
                        const timeoutId = window.setTimeout(() => {
                            if (!state.activeDisconnectedPlayers.delete(remotePlayerId)) {
                                return;
                            }
                            state.activeDisconnectTimers.delete(remotePlayerId);
                            state.activeTimedOutPlayers.add(remotePlayerId);
                            peerMirrorKeyframeRequests.delete(remotePlayerId);
                            javaEvents.push(multiplayerEncodeEvent("peer-timeout", [remotePlayerId]));
                            pushStatus("Player " + remotePlayerId + " did not reconnect in time.");
                        }, MULTIPLAYER_ROOM_RECONNECT_GRACE_MS);
                        state.activeDisconnectTimers.set(remotePlayerId, timeoutId);
                    }

                    room.onPeerJoin((peerId) => {
                        pushStatus("Transport peer " + peerId + " joined room " + state.visibleRoomName + ".", {
                            debugOnly: true
                        });
                        sendHelloIfReady(peerId);
                        sendProgressIfReady();
                        if (state.isWatcher) {
                            state.keyframeRequested = false;
                        } else if (!state.isHost && !alreadyRestored && !state.snapshotApplied) {
                            state.snapshotRequested = false;
                        }
                        requestSnapshotIfNeeded();
                        requestWatcherKeyframeIfNeeded(false);
                    });
                    room.onPeerLeave((peerId) => {
                        pushStatus("Transport peer " + peerId + " left room " + state.visibleRoomName + ".", {
                            debugOnly: true
                        });
                        const remotePlayerId = peerPlayers.get(peerId) || state.activePeerParticipants.get(peerId);
                        const remoteRole = peerRoles.get(peerId) || "player";
                        peerPlayers.delete(peerId);
                        peerRoles.delete(peerId);
                        state.activePeerParticipants.delete(peerId);
                        const watcherStatusKey = state.activeWatcherStatusPeers.get(peerId);
                        if (watcherStatusKey) {
                            state.activeWatcherStatusPeers.delete(peerId);
                            state.activeWatcherStatusMessages.delete(watcherStatusKey);
                        }
                        if (remotePlayerId && remoteRole !== "watcher"
                                && !activePlayerHasLivePeer(remotePlayerId)) {
                            peerReplaySequences.delete(remotePlayerId);
                            peerMirrorKeyframeRequests.delete(remotePlayerId);
                            javaEvents.push(multiplayerEncodeEvent("peer-left", [remotePlayerId]));
                            scheduleActivePeerDisconnectTimeout(remotePlayerId);
                        }
                        if (state.isWatcher && remotePlayerId === state.watchTargetId) {
                            state.watchTargetSeen = false;
                            state.keyframeRequested = false;
                            pushStatus("Watch target player " + state.watchTargetId + " left room.");
                        }
                    });

                    function handleHello(data, peerId) {
                        const remotePlayerId = data && data.playerId ? String(data.playerId) : "";
                        if (!remotePlayerId || remotePlayerId === playerId) {
                            return false;
                        }
                        peerPlayers.set(peerId, remotePlayerId);
                        peerRoles.set(peerId, data.role === "watcher" ? "watcher" : "player");
                        if (data.role !== "watcher") {
                            clearActivePeerDisconnect(remotePlayerId);
                        }
                        if (data.role !== "watcher" && data.mirrorState
                                && data.mirrorState.kind === "status") {
                            handlePeerMirrorReplay(data.mirrorState, "status");
                        }
                        if (data.role !== "watcher" && data.roomOutcome) {
                            javaEvents.push(multiplayerEncodeEvent("outcome-status", [
                                remotePlayerId,
                                String(data.roomOutcome || "")
                            ]));
                        }
                        if (state.isWatcher && remotePlayerId === state.watchTargetId && data.role !== "watcher") {
                            noteWatchTargetSeen();
                            requestWatcherKeyframeIfNeeded(false);
                        } else if (!state.isWatcher && data.role === "watcher" && data.watchTargetId === playerId) {
                            const watcherStatusKey = remotePlayerId + ":" + String(data.watchTargetId || "");
                            const previousWatcherStatusKey = state.activeWatcherStatusPeers.get(peerId);
                            if (previousWatcherStatusKey && previousWatcherStatusKey !== watcherStatusKey) {
                                state.activeWatcherStatusMessages.delete(previousWatcherStatusKey);
                            }
                            if (!state.activeWatcherStatusMessages.has(watcherStatusKey)) {
                                state.activeWatcherStatusMessages.add(watcherStatusKey);
                                javaEvents.push(multiplayerEncodeEvent("status", [
                                    "Watcher " + remotePlayerId + " is watching this run."
                                ]));
                            }
                            state.activeWatcherStatusPeers.set(peerId, watcherStatusKey);
                        } else {
                            const watcherStatusKey = state.activeWatcherStatusPeers.get(peerId);
                            if (watcherStatusKey) {
                                state.activeWatcherStatusPeers.delete(peerId);
                                state.activeWatcherStatusMessages.delete(watcherStatusKey);
                            }
                        }
                        return true;
                    }

                    state.debugInjectPeerHello = function(remotePlayerId, role, mirrorState) {
                        remotePlayerId = String(remotePlayerId || "").trim();
                        if (!remotePlayerId) {
                            return false;
                        }
                        const payload = {
                            playerId: remotePlayerId,
                            role: role === "watcher" ? "watcher" : "player",
                            watchTargetId: ""
                    };
                        if (mirrorState && typeof mirrorState === "object") {
                            payload.mirrorState = Object.assign({}, mirrorState);
                            payload.mirrorState.playerId = String(payload.mirrorState.playerId || remotePlayerId);
                        }
                        return handleHello(payload, "debug-" + remotePlayerId);
                    };

                    getHello(async (data, peerId) => {
                        const payload = await verifyActivePayload("hello", data, peerId, "playerId");
                        if (payload) {
                            handleHello(payload, peerId);
                        }
                    });

                    getSnapshotRequest(async (data, peerId) => {
                        data = await verifyActivePayload("snapshot-request", data, peerId, "playerId");
                        if (!data) {
                            return;
                        }
                        if (!state.isHost) {
                            return;
                        }
                        try {
                            const snapshot = createBrowserDataSnapshotPayload("");
                            const resumeSlot = Number(state.lastProgress && state.lastProgress.slot) || 1;
                            const response = {
                                requestId: data && data.requestId,
                                hostPlayerId: playerId,
                                resumeSlot,
                                snapshot
                            };
                            sendActivePayload("snapshot-response", response,
                                    sendSnapshotResponse, peerId);
                            pushStatus("Sent snapshot to player " + ((data && data.playerId) || peerId) + ".");
                        } catch (error) {
                            pushStatus("Snapshot send failed: " + browserDataBackupErrorMessage(error));
                        }
                    });

                    getSnapshotResponse(async (data, peerId) => {
                        data = await verifyActivePayload("snapshot-response", data, peerId, "hostPlayerId");
                        if (!data) {
                            return;
                        }
                        if (state.isWatcher || state.isHost || state.snapshotApplied || !data || !data.snapshot) {
                            return;
                        }
                        if (state.pendingRequestId && data.requestId !== state.pendingRequestId) {
                            return;
                        }
                        try {
                            const result = restoreBrowserDataSnapshot(data.snapshot);
                            state.snapshotApplied = true;
                            if (storage) {
                                storage.setItem(restoreKey, "true");
                                storage.setItem(restoreKey + ".message",
                                        "Cloned host run from player " + (data.hostPlayerId || "1") + ".");
                                storage.setItem(restoreKey + ".resumeSlot", String(Number(data.resumeSlot) || 1));
                            }
                            pushStatus("Cloned host run. Reloading...");
                            reloadAfterMultiplayerCleanup(multiplayerUrlWithoutCloneFlag());
                            logWebParity("multiplayer snapshot restored", result);
                        } catch (error) {
                            pushStatus("Snapshot restore failed: " + browserDataBackupErrorMessage(error));
                        }
                    });

                    getProgress(async (data, peerId) => {
                        data = await verifyActivePayload("floor-progress", data, peerId, "playerId");
                        if (!data) {
                            return;
                        }
                        if (!data || String(data.playerId || "") === playerId) {
                            return;
                        }
                        const remotePlayerId = String(data.playerId || "");
                        if (state.activeTimedOutPlayers.has(remotePlayerId)
                                || state.activeDisconnectedPlayers.has(remotePlayerId)) {
                            return;
                        }
                        if (state.isWatcher) {
                            if (remotePlayerId === state.watchTargetId) {
                                noteWatchTargetSeen();
                                requestWatcherKeyframeIfNeeded(false);
                            }
                            return;
                        }
                        javaEvents.push(multiplayerEncodeEvent("floor", [
                            remotePlayerId,
                            Number(data.depth) || 0,
                            Number(data.branch) || 0,
                            Number(data.turns) || 0
                        ]));
                    });

                    getKeyframeRequest(async (data, peerId) => {
                        data = await verifyActivePayload("keyframe-request", data, peerId, "watcherId");
                        if (!data) {
                            return;
                        }
                        if (state.isWatcher || !data || String(data.targetPlayerId || "") !== playerId) {
                            return;
                        }
                        const mirrorOnly = data.mirrorOnly === true || data.requesterRole === "peer-mirror";
                        if (!mirrorOnly) {
                            deferWatcherKeyframeResponse(data, peerId);
                            return;
                        }
                        sendWatcherKeyframeResponse(data, peerId);
                    });

                    getKeyframeResponse(async (data, peerId) => {
                        data = await verifyActivePayload("keyframe-response", data, peerId, "targetPlayerId");
                        if (!data) {
                            return;
                        }
                        if (!data) {
                            return;
                        }
                        if (!state.isWatcher) {
                            applyPeerMirrorKeyframe(data);
                            return;
                        }
                        if (String(data.targetPlayerId || "") !== state.watchTargetId) {
                            return;
                        }
                        if (state.pendingKeyframeRequestId && data.requestId !== state.pendingKeyframeRequestId) {
                            return;
                        }
                        if (data.roomOutcome) {
                            javaEvents.push(multiplayerEncodeEvent("outcome-status", [
                                String(data.targetPlayerId || ""),
                                String(data.roomOutcome || "")
                            ]));
                        }
                        window.__shpdMultiplayer.restoreWatcherKeyframe(data);
                    });

                    getReplayEvent(async (data, peerId) => {
                        data = await verifyActivePayload("replay", data, peerId, "playerId");
                        if (!data) {
                            return;
                        }
                        if (!data || String(data.playerId || "") === playerId) {
                            return;
                        }
                        const remotePlayerId = String(data.playerId || "");
                        if (state.activeTimedOutPlayers.has(remotePlayerId)) {
                            return;
                        }
                        const disconnected = state.activeDisconnectedPlayers.has(remotePlayerId);

                        const kind = String(data.kind || "unknown");
                        if (!state.isWatcher) {
                            handlePeerMirrorReplay(data, kind);
                            return;
                        }
                        handlePeerMirrorReplay(data, kind);
                        if (disconnected) {
                            return;
                        }

                        if (remotePlayerId !== state.watchTargetId) {
                            return;
                        }
                        if (!state.replayReady) {
                            requestWatcherKeyframeIfNeeded(false);
                            return;
                        }

                        const seq = Number(data.seq) || 0;
                        if (seq <= state.expectedReplaySequence) {
                            return;
                        }
                        if (seq !== state.expectedReplaySequence + 1) {
                            state.replayReady = false;
                            if (storage) {
                                storage.removeItem(currentWatcherRestoreKey() + ".replayReady");
                            }
                            pushStatus("Replay stream gap from player " + state.watchTargetId + ". Requesting keyframe.");
                            requestWatcherKeyframeIfNeeded(true);
                            return;
                        }

                        state.expectedReplaySequence = seq;
                        if (storage) {
                            storage.setItem(currentWatcherRestoreKey() + ".replaySequence", String(seq));
                        }
                        enqueueReplayJavaEvent(data, kind);
                        if (kind === "transition" || kind === "unknown") {
                            state.replayReady = false;
                            if (storage) {
                                storage.removeItem(currentWatcherRestoreKey() + ".replayReady");
                            }
                            requestWatcherKeyframeIfNeeded(true);
                        }
                    });

                    function requestSnapshotIfNeeded() {
                        if (state.isWatcher || state.isHost || alreadyRestored || state.snapshotApplied || state.snapshotRequested) {
                            return;
                        }
                        state.snapshotRequested = true;
                        state.pendingRequestId = playerId + "-" + Date.now();
                        const payload = {
                            playerId,
                            requestId: state.pendingRequestId
                    };
                        sendActivePayload("snapshot-request", payload, sendSnapshotRequest);
                        pushStatus("Requested host snapshot for room " + state.visibleRoomName + ".");
                    }

                    state.ready = true;
                    if (state.isWatcher) {
                        pushStatus("Joined multiplayer room " + state.visibleRoomName + " as watcher " + playerId
                                + " watching player " + state.watchTargetId + ".");
                    } else {
                        pushStatus((state.isHost ? "Hosting" : "Joined") + " multiplayer room " + state.visibleRoomName
                                + " as player " + playerId + ".");
                    }
                    sendHelloIfReady();
                    sendProgressIfReady();
                    requestSnapshotIfNeeded();
                    requestWatcherKeyframeIfNeeded(true);
                    state.retryIntervalId = window.setInterval(() => {
                        sendHelloIfReady();
                        if (state.isWatcher) {
                            requestWatcherKeyframeIfNeeded(false);
                        } else if (!state.isHost && !alreadyRestored && !state.snapshotApplied) {
                            state.snapshotRequested = false;
                            requestSnapshotIfNeeded();
                        }
                    }, 3000);
                }).catch((error) => {
                    cleanupMultiplayerRoom("startup-failure");
                    pushStatus("Multiplayer failed to start: " + browserDataBackupErrorMessage(error));
                });
            }

            installWebMultiplayer();
            startDevUrlRoomActionRunner();

            function syncGameContainerRatio() {
                const canvas = document.getElementById("canvas");
                const container = document.getElementById("game-container");
                if (!canvas || !container) {
                    return;
                }

                const width = Number(canvas.getAttribute("width")) || canvas.width || DEFAULT_GAME_WIDTH;
                const height = Number(canvas.getAttribute("height")) || canvas.height || DEFAULT_GAME_HEIGHT;
                if (width > 0 && height > 0) {
                    container.style.setProperty("--game-width", width);
                    container.style.setProperty("--game-height", height);
                }
            }

            function canvasPageLeft(canvas) {
                const rect = canvas.getBoundingClientRect();
                return Math.round(rect.left + (window.scrollX || window.pageXOffset || 0));
            }

            function canvasPageTop(canvas) {
                const rect = canvas.getBoundingClientRect();
                return Math.round(rect.top + (window.scrollY || window.pageYOffset || 0));
            }

            function installCanvasInputOffsetShim() {
                const canvas = document.getElementById("canvas");
                if (!canvas || canvas.__shpdInputOffsetShimInstalled) {
                    return;
                }

                try {
                    Object.defineProperties(canvas, {
                        offsetLeft: {
                            configurable: true,
                            get: function() {
                                return canvasPageLeft(this);
                            }
                        },
                        offsetTop: {
                            configurable: true,
                            get: function() {
                                return canvasPageTop(this);
                            }
                        }
                    });
                    canvas.__shpdInputOffsetShimInstalled = true;
                    logWebParity("canvas input offset shim installed", canvasInputGeometry(canvas));
                } catch (error) {
                    logWebParity("canvas input offset shim failed", {
                        error: error && (error.message || error.name || String(error))
                    });
                }
            }

            function observeGameResolution() {
                const canvas = document.getElementById("canvas");
                if (!canvas) {
                    return;
                }

                const observer = new MutationObserver(syncGameContainerRatio);
                observer.observe(canvas, { attributes: true, attributeFilter: ["width", "height"] });
                window.addEventListener("resize", () => requestAnimationFrame(syncGameContainerRatio));
            }

            function preventPageKeyHandling(event) {
                if (isGameTextInputActive()) {
                    const syntheticModifierRelease = event.__shpdModifierRelease === true;
                    trackGameTextInputModifierState(event);
                    if (syntheticModifierRelease) {
                        return;
                    }
                    logWebParity("browser key text input active " + event.type, {
                        key: event.key,
                        code: event.code,
                        repeat: event.repeat,
                        defaultPreventedBefore: event.defaultPrevented
                    });
                    if (event.type === "keydown"
                            && (event.key === "Tab" || event.code === "Tab"
                                    || event.keyCode === 9 || event.which === 9)) {
                        event.preventDefault();
                    }
                    return;
                }
                if (document.activeElement !== document.getElementById("canvas")
                        || event.altKey || event.ctrlKey || event.metaKey) {
                    return;
                }

                logWebParity("browser key " + event.type, {
                    key: event.key,
                    code: event.code,
                    repeat: event.repeat,
                    defaultPreventedBefore: event.defaultPrevented
                });
                event.preventDefault();
            }

            function pointerClientPosition(event) {
                const touch = event.changedTouches && event.changedTouches.length > 0
                        ? event.changedTouches[0]
                        : event;
                if (!touch || typeof touch.clientX !== "number" || typeof touch.clientY !== "number") {
                    return null;
                }
                return {
                    x: touch.clientX,
                    y: touch.clientY
                };
            }

            function canvasInputGeometry(canvas, event) {
                if (!canvas) {
                    return {};
                }

                const rect = canvas.getBoundingClientRect();
                const position = event ? pointerClientPosition(event) : null;
                const clientWidth = canvas.clientWidth || rect.width || 1;
                const clientHeight = canvas.clientHeight || rect.height || 1;
                const data = {
                    canvasWidth: canvas.width,
                    canvasHeight: canvas.height,
                    clientWidth: canvas.clientWidth,
                    clientHeight: canvas.clientHeight,
                    rectLeft: Math.round(rect.left),
                    rectTop: Math.round(rect.top),
                    offsetLeft: canvas.offsetLeft,
                    offsetTop: canvas.offsetTop,
                    offsetParent: canvas.offsetParent && (canvas.offsetParent.id || canvas.offsetParent.tagName)
                };
                if (position) {
                    const scrollX = window.scrollX || window.pageXOffset || 0;
                    const scrollY = window.scrollY || window.pageYOffset || 0;
                    data.clientX = Math.round(position.x);
                    data.clientY = Math.round(position.y);
                    data.gameXByOffset = Math.round((position.x - canvas.offsetLeft + scrollX) * canvas.width / clientWidth);
                    data.gameYByOffset = Math.round((position.y - canvas.offsetTop + scrollY) * canvas.height / clientHeight);
                    data.gameXByRect = Math.round((position.x - rect.left) * canvas.width / clientWidth);
                    data.gameYByRect = Math.round((position.y - rect.top) * canvas.height / clientHeight);
                }
                return data;
            }

            function logCanvasInputEvent(event) {
                const canvas = document.getElementById("canvas");
                const targetId = event.target && event.target.id;
                const data = canvasInputGeometry(canvas, event);
                data.target = targetId || event.target && event.target.tagName;
                logWebParity("browser input " + event.type, data);
            }

            function start() {
                if (gameStarted) {
                    return;
                }

                gameStarted = true;
                syncGameContainerRatio();
                installCanvasInputOffsetShim();
                observeGameResolution();
                logWebParity("game start load", {});
                focusGameCanvas();
                %MODE%
                requestAnimationFrame(() => {
                    syncGameContainerRatio();
                    logWebParity("canvas input geometry after start", canvasInputGeometry(document.getElementById("canvas")));
                    focusGameCanvas();
                });
            }

            window.addEventListener("load", start);
            window.addEventListener("focus", focusActiveGameSurface);
            window.addEventListener("pageshow", () => {
                pagehideDispatched = false;
            }, { capture: true });
            window.addEventListener("pagehide", () => {
                pagehideDispatched = true;
                logWebParity("pagehide", {
                    visibilityState: document.visibilityState,
                    activeElement: document.activeElement && document.activeElement.id
                });
            }, { capture: true });
            document.addEventListener("visibilitychange", (event) => {
                const data = {
                    visibilityState: document.visibilityState,
                    activeElement: document.activeElement && document.activeElement.id
                };
                logWebParity("visibilitychange", data);
                if (pagehideDispatched && document.visibilityState === "hidden") {
                    logWebParity("visibilitychange suppressed after pagehide", data);
                    event.stopImmediatePropagation();
                } else if (document.visibilityState === "visible" && isGameTextInputActive()) {
                    releaseGameTextInputModifiers("visibility-visible");
                }
            }, { capture: true });
            window.addEventListener("keydown", preventPageKeyHandling, { capture: true });
            window.addEventListener("keyup", preventPageKeyHandling, { capture: true });
            ["pointerdown", "mousedown", "mouseup", "click", "touchstart", "touchend"].forEach((eventName) => {
                document.addEventListener(eventName, logCanvasInputEvent, { capture: true });
            });
            document.addEventListener("pointerdown", () => {
                if (gameStarted && !isGameTextInputActive()) {
                    focusGameCanvas();
                }
            }, { capture: true });
        </script>
        %JS_SCRIPT%
    </body>
</html>
