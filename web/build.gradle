import org.teavm.gradle.api.OptimizationLevel

plugins {
    id 'java'
    id 'org.teavm' version '0.14.0'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

ext.appMainClass = "com.shatteredpixel.shatteredpixeldungeon.web.WebLauncher"
ext.gdxTeaVMVersion = "1.5.6"

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.github.xpenatan.gdx-teavm:backend-web:$gdxTeaVMVersion"
    implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-teavm:$gdxTeaVMVersion"
    implementation "com.github.xpenatan.gdx-teavm:gdx-controllers-teavm:$gdxTeaVMVersion"

    testImplementation "junit:junit:4.13.2"
}

teavm {
    all {
        mainClass = appMainClass
        debugInformation = true
        fastGlobalAnalysis = true
        optimization = OptimizationLevel.NONE
        processMemory = 2048
    }
    js {
        relativePathInOutputDir = "webapp/js"
        targetFileName = "dungeon.js"
        sourceMap = true
        obfuscated = false
    }
    wasmGC {
        relativePathInOutputDir = "webapp/wasm"
        targetFileName = "dungeon.wasm"
        sourceMap = true
        obfuscated = false
        copyRuntime = true
    }
}

tasks.register('buildWebBundle', JavaExec) {
    group = 'teavm'
    description = 'Builds the libGDX TeaVM browser bundle with copied Shattered Pixel Dungeon assets.'
    dependsOn classes
    workingDir = projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.web.BuildWeb'
    inputs.files(sourceSets.main.runtimeClasspath)
            .withPropertyName('runtimeClasspath')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('../core/src/main/assets')
            .withPropertyName('coreAssets')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('../desktop/src/main/assets')
            .withPropertyName('desktopAssets')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file('src/main/resources/webapp/index.html')
            .withPropertyName('webappTemplate')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('mainClass', appMainClass)
    outputs.dir(layout.buildDirectory.dir('dist'))
}

tasks.register('buildWebReleaseBundle', JavaExec) {
    group = 'teavm'
    description = 'Builds an optimized static TeaVM browser bundle for release.'
    dependsOn classes
    workingDir = projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.web.BuildWeb'
    args '--release', '--output', layout.buildDirectory.dir('release').get().asFile.absolutePath
    def webParityLogging = (project.findProperty('webParityLogging') ?: 'false').toString().toBoolean()
    if (webParityLogging) {
        args '--web-parity-logging'
    }
    inputs.files(sourceSets.main.runtimeClasspath)
            .withPropertyName('runtimeClasspath')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('../core/src/main/assets')
            .withPropertyName('coreAssets')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('../desktop/src/main/assets')
            .withPropertyName('desktopAssets')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file('src/main/resources/webapp/index.html')
            .withPropertyName('webappTemplate')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('mainClass', appMainClass)
    inputs.property('release', true)
    inputs.property('webParityLogging', webParityLogging)
    outputs.dir(layout.buildDirectory.dir('release'))
    doFirst {
        delete layout.buildDirectory.dir('release')
    }
    doLast {
        delete fileTree(layout.buildDirectory.dir('release')) {
            include '**/*.teavmdbg'
            include '**/*.map'
            include '**/.DS_Store'
            include '**/*.zip'
        }
        delete layout.buildDirectory.dir('release/webapp/WEB-INF')
        delete layout.buildDirectory.dir('release/webapp/assets/webapp/WEB-INF')
        def preload = layout.buildDirectory.file('release/webapp/assets/preload.txt').get().asFile
        if (preload.exists()) {
            def lines = preload.readLines('UTF-8').findAll { !it.contains('/webapp/WEB-INF/') }
            preload.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        }
    }
}

tasks.register('zipWebReleaseBundle', Zip) {
    group = 'teavm'
    description = 'Packages the optimized static TeaVM web release bundle as a zip.'
    dependsOn buildWebReleaseBundle
    archiveFileName = 'shattered-pixel-dungeon-web-release.zip'
    destinationDirectory = layout.buildDirectory.dir('release-zip')
    from(layout.buildDirectory.dir('release/webapp')) {
        into 'shattered-pixel-dungeon-web'
        exclude '**/*.teavmdbg', '**/*.map', '**/.DS_Store', '**/*.zip', 'WEB-INF/**'
    }
}

tasks.register('serveWebBundle', Exec) {
    group = 'teavm'
    description = 'Serves the generated TeaVM browser bundle on http://127.0.0.1:8080/.'
    dependsOn buildWebBundle
    workingDir = layout.buildDirectory.dir('dist/webapp').get().asFile
    commandLine "${System.properties['java.home']}/bin/java", '-m', 'jdk.httpserver', '-b', '127.0.0.1', '-p', '8080'
}
